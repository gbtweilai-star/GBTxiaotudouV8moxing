<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大脑执行层 · GBT小土豆V8</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAWklEQVR42mNgGAWjYBSMglEwCkbBKBgFo2AUjIJRMApGwSgYBaNgFIyCUTAKRsEoGAWjYBSMglEwCkbBKBgFo2AUjIJRMApGwSgYBaNgFIyCUTAKRsEoAAB2gAH/8kQ0dQAAAABJRU5ErkJggg==">
<style>
  :root{
    /* OKLCH 思路的感知均匀近似（sRGB 十六进制），四态色盲安全：
       取"蓝-橙-黄-红"轴而非"红-绿"轴，红绿色盲也能分辨 */
    --bg:#04060e; --bg2:#0a0f22;
    --idle:#4a5570;        /* 静默：冷灰蓝 */
    --ok:#38e0a0;          /* 通：青绿 */
    --busy:#f0b429;        /* 忙：琥珀 */
    --stuck:#ff8c42;       /* 卡：橙 */
    --fail:#ff5f6d;        /* 失败：红 */
    --wire:#00e5ff;        /* 导线 / 电流（万能插脉冲用这个相） */
    --text:#e8eefc; --dim:#8c98b8;
    --line:#22304f;
    --mono:"SF Mono","JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:14px/1.6 "Microsoft YaHei UI",system-ui,sans-serif;overflow:hidden}
  canvas{display:block;position:absolute;inset:0}
  #hud{position:absolute;inset:0;pointer-events:none}
  .panel{position:absolute;pointer-events:none}
  #top{left:20px;top:16px}
  #top h1{margin:0;font-size:19px;letter-spacing:.5px}
  #top .sub{color:var(--dim);font-size:12px;margin-top:3px}
  #top .src{color:#5d6a8a;font-size:11px;margin-top:6px;line-height:1.5}
  #legend{right:18px;top:16px;text-align:right;font-size:12px}
  #legend .row{margin:3px 0;color:var(--dim)}
  #legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    margin-right:6px;vertical-align:1px}
  #legend .ttl{color:var(--text);font-weight:600;font-size:12px;margin-bottom:6px}
  /* 电量条：与画面里节点上的充电弧同一个语义 */
  #legend .meter{display:inline-block;width:26px;height:7px;border-radius:2px;
    margin-right:6px;vertical-align:0;background:rgba(0,229,255,.14);
    border:.5px solid rgba(0,229,255,.38);overflow:hidden;position:relative}
  #legend .meter i{position:absolute;inset:0 62% 0 0;background:var(--wire);
    box-shadow:0 0 6px var(--wire)}
  #clock{left:20px;bottom:16px;font-size:12px;color:var(--dim)}
  #clock b{color:var(--text);font-variant-numeric:tabular-nums}
  #clock .k{color:#4d5a7d}
  #note{right:18px;bottom:16px;max-width:48ch;text-align:right;font-size:11px;
    color:#5d6a8a;line-height:1.5}
  #sign{left:20px;bottom:40px;font:500 10.5px/1.6 var(--mono);color:#3f4a66;letter-spacing:.04em}
  #warn{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
    font-size:13px;color:var(--dim);display:none;max-width:60ch;line-height:1.7}
  #warn code{background:#1a2138;padding:2px 6px;border-radius:4px;color:#9fb4e0}
  @media (prefers-reduced-motion: reduce){ #motion-note{display:block} }
  #motion-note{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="panel" id="top">
    <h1>大脑执行层 · 三维排布与连接网络</h1>
    <div class="sub">五维合一脑 · 星形拓扑（不是链）· 布局 sugiyama-layered(barycenter) · 三维：手写透视投影（零依赖）</div>
    <div class="src" id="src">正在取真实结构…</div>
  </div>
  <div class="panel" id="legend">
    <div class="ttl">形态即状态</div>
    <div class="row"><span class="dot" style="background:var(--idle)"></span>静默（没跑就是没跑）</div>
    <div class="row"><span class="dot" style="background:var(--ok)"></span>通（真跑过且成功）</div>
    <div class="row"><span class="dot" style="background:var(--busy)"></span>忙（正在跑）</div>
    <div class="row"><span class="dot" style="background:var(--stuck)"></span>卡（有进无出）</div>
    <div class="row"><span class="dot" style="background:var(--fail)"></span>失败 / 被拒</div>
    <div class="row" style="margin-top:8px"><span class="meter"><i></i></span>节点充电 = 万能插真在跑</div>
    <div class="row">连线通电 = 真走过那条边</div>
  </div>
  <div class="panel" id="clock">
    真实事件 <b id="evn">0</b> 条 · 最新 <b id="evt">—</b> · <span class="k">在途电流</span> <b id="pkt">0</b>
  </div>
  <div class="panel" id="note"></div>
  <div class="panel" id="sign">开发者：自由的风 · GBT小土豆V8 · 本署名不可删除、不可篡改归属</div>
  <div id="warn"></div>
</div>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   大脑执行层 · 三维排布图与连接网络
   Owner：「整个大脑执行层排布图和连接网络都要可视化呈现出来」
   Owner：「我要的是那种逼真和真实执行的感觉」·「所有细节找专业工具实现高级感」
   Owner（本轮）：「3D 高清立体呈现要做的逼真；万能插脉冲也要有，就像电量冲的视觉感」

   ═══ 逼真的六条硬判据（每条都可证伪，写在代码里防后来人放宽）═══
     ① 只在有真事件时动 —— 停掉调用，图必须**暗而静**（只有存活心跳）
     ② 时长 = 真实耗时 —— 不按固定节奏播
     ③ 路径 = 真实路径 —— 亮的边必须能在 audit.jsonl 找到对应事件
     ④ 卡住 = 真卡住 —— 有进无出 ⇒ 琥珀，不许自动"假装完成"
     ⑤ 失败 = 真失败 —— 真 error/denied ⇒ 停在那维变红，不抹平
     ⑥ 静默 = 真静默 —— 无事发生时不放任何装饰性循环动画

   ═══ 本轮的立体与电流（都是可证伪的，不是"加点装饰"）═══
     · **真三维**：世界坐标 → 绕 Y 轴偏航 → 绕 X 轴俯仰 → 透视除法。
       有地面网格 + 每个节点的落地光柱与影 ⇒ 纵深感是**投影算出来的**，
       不是靠"画个渐变假装远"。零依赖（宿主 DENY 挡了 node_modules 与 vendor，
       所以不许引 three —— 这里手写投影，和 capabilities.html 的能力球同一路数）。
     · **深度语义**：远 = 更暗更蓝更细（大气消光）；近 = 更亮更粗。
       绘制顺序按深度排序（远的先画），所以遮挡关系是对的。
     · **万能插脉冲 = 电量冲**：一条边通电时不是"一个白点滑过"，而是
       ① 电流包有**亮头 + 渐隐尾**（尾部取样多段，像真的电荷在导线里走）；
       ② 包经过处导线**局部增亮**（通电感），不是整条一起亮；
       ③ 到达时目标节点**充一格电**（节点外圈按电量填弧）⇒ 这就是"电量冲"；
       ④ 同一维可并发多包（错相位脉冲串）—— 真实拍发就是这样，不是节拍器。
   ═══════════════════════════════════════════════════════════════════════ */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const trail = document.createElement('canvas');          // 残影层
const tctx = trail.getContext('2d');
const glow = document.createElement('canvas');           // 辉光模糊层
const gctx = glow.getContext('2d');

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DPR = Math.min(2, window.devicePixelRatio || 1);   // 超采样：>= 设备像素比

let W = 0, H = 0;
function resize(){
  W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR);
  for (const c of [cv, trail, glow]) { c.width = W; c.height = H; }
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  ctx.setTransform(1,0,0,1,0,0); tctx.setTransform(1,0,0,1,0,0);
}
addEventListener('resize', resize); resize();

/* ── 四态色（从 CSS 变量取，单一来源）── */
const CSS = getComputedStyle(document.documentElement);
const C = {
  idle: CSS.getPropertyValue('--idle').trim(),
  ok:   CSS.getPropertyValue('--ok').trim(),
  busy: CSS.getPropertyValue('--busy').trim(),
  stuck:CSS.getPropertyValue('--stuck').trim(),
  fail: CSS.getPropertyValue('--fail').trim(),
  line: CSS.getPropertyValue('--line').trim(),
  wire: CSS.getPropertyValue('--wire').trim(),
};
function rgbOf(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function rgba(hex, a){ const c = rgbOf(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function mix(hexA, hexB, k){
  const a = rgbOf(hexA), b = rgbOf(hexB);
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*k)},${Math.round(a[1]+(b[1]-a[1])*k)},${Math.round(a[2]+(b[2]-a[2])*k)})`;
}

/* ── 状态模型：span 进/出成对 ── */
const ST = { IDLE:'idle', OK:'ok', BUSY:'busy', STUCK:'stuck', FAIL:'fail' };
const STUCK_MS = 12000;                 // 有进无出超过这个数 ⇒ 卡
let graph = null;                       // {layout, live}
let nodeState = new Map();              // id -> {state, at, since}
let edgeHeat = new Map();               // "a→b" -> 0..1（真走过才亮）
let nodeCharge = new Map();             // id -> 0..1（真到达才充电，这就是"电量"）
const started = Date.now();

function stateColor(s){
  return s === ST.OK ? C.ok : s === ST.BUSY ? C.busy
       : s === ST.STUCK ? C.stuck : s === ST.FAIL ? C.fail : C.idle;
}

/* 真实事件 → 状态。只认 audit.jsonl 里的真 kind，找不到就保持静默。 */
function applyLive(live){
  if (!live || !live.ok) return 0;
  const latest = live.latest_by_kind || {};
  const now = Date.now();
  let fresh = 0;
  /* ── 五维状态：**直接来自真实进出事件**（brain_enter/brain_exit）──
     忙 = 进了没出；卡 = 进了超 20s 没出；成/败 = 出了（带真实 ms）。
     这是"真实执行的感觉"的根：动画可以按**真实耗时**走，
     而不是固定节奏 —— route 亮 50ms、verify 亮 2342ms，就是它真跑的时间。 */
  const ds = live.dims_state || {};
  for (const [dim, v] of Object.entries(ds)){
    nodeState.set(dim, {
      state: v.state === 'ok' ? ST.OK : v.state === 'fail' ? ST.FAIL
           : v.state === 'busy' ? ST.BUSY : v.state === 'stuck' ? ST.STUCK : ST.IDLE,
      at: Date.parse((v.iso || '') + '+07:00') || Date.now(),
      since: now, ms: v.ms, age_s: v.age_s,
    });
    fresh++;
    // 该维真跑过 ⇒ 它的边通电（unify→该维）
    if (graph){
      for (const e of graph.layout.edges || []){
        if (e.to === 'dim:' + dim || e.from === 'dim:' + dim) spark(e, v.ms);
      }
    }
  }
  for (const [kind, v] of Object.entries(latest)){
    const ev = v.event;
    const ts = (v.ts || 0) * 1000;
    const prev = nodeState.get(kind);
    if (prev && prev.at === ts) continue;         // 同一条事件不重复点灯
    fresh++;
    nodeState.set(kind, {
      state: ev === 'ok' ? ST.OK : (ev === 'denied' || ev === 'error') ? ST.FAIL : ST.IDLE,
      at: ts, since: now,
    });
    // 真走过 ⇒ 相关边给热度（从中心维流向该能力）
    if (graph){
      for (const e of graph.layout.edges || []){
        if (e.to === 'cap:' + kind || e.from === 'cap:' + kind) spark(e, null);
      }
    }
  }
  // ④ 有进无出 ⇒ 卡（这里用"最近一次成功距今过久但仍在跑"的保守近似：
  //    只有真拿到 busy 语义才置忙，否则不编"正在跑"）
  for (const [id, s] of nodeState){
    if (s.state === ST.BUSY && now - s.since > STUCK_MS) s.state = ST.STUCK;
  }
  if (fresh){
    document.getElementById('evn').textContent = live.count ?? 0;
    document.getElementById('evt').textContent = live.last_iso || '—';
  }
  return fresh;
}

/* ═══════════════ 电流包（万能插脉冲）═══════════════
   一条边通电 ⇒ 派 1~3 个包。包速按**真实耗时**折算：真跑 2342ms 的那一维，
   电流就走得慢（像大电感充电）；真跑 50ms 的，一闪而过。
   包走完 ⇒ 目标节点 +1 格电（nodeCharge）。
   ⚠️ 这里**不编事件**：只有 applyLive 里真读到事件才会 spark()。 */
const packets = [];                 // {from,to,t0,dur,phase}
let sparkSeq = 0;
function spark(edge, realMs){
  const key = edge.from + '→' + edge.to;
  edgeHeat.set(key, 1);
  if (REDUCED) return;
  const dur = Math.max(420, Math.min(2600, (realMs && realMs > 0 ? realMs : 900)));
  const n = (sparkSeq++ % 2 === 0) ? 2 : 1;      // 脉冲串：不是节拍器，但有并发感
  for (let i = 0; i < n; i++){
    packets.push({ from: edge.from, to: edge.to, t0: performance.now() + i * (dur * 0.32), dur });
  }
  if (packets.length > 90) packets.splice(0, packets.length - 90);
}
function stepPackets(now){
  for (let i = packets.length - 1; i >= 0; i--){
    const p = packets[i];
    if (now - p.t0 > p.dur + 260){                 // 到站后留一点"余辉"时间再回收
      const cur = nodeCharge.get(p.to) || 0;
      nodeCharge.set(p.to, Math.min(1, cur + 0.34));   // 到达 ⇒ 充一格
      packets.splice(i, 1);
    }
  }
  for (const [k, v] of nodeCharge){                // 电量自己会掉（像真的自放电）
    const nv = v * 0.992 - 0.0012;
    if (nv <= 0.004) nodeCharge.delete(k); else nodeCharge.set(k, nv);
  }
}

/* ═══════════════ 三维：手写投影 ═══════════════
   世界坐标 → 偏航(Y) → 俯仰(X) → 透视除法。
   节点全在 Z=0 的中面，纵深来自**分层高度 + 地面 + 相机俯仰**（这样遮挡关系稳定、
   不会因为转起来而互相穿插 —— 数据页要的是"一进去就知道这是个专业仪器"，不是晃。 */
const CAM = { yaw0: 0.30, pitch: 0.30, dist: 11.6, focal: 15.0, unit: 0.058 };
/* 地面高度：必须**低于最低一行**（r3 底座）。第一版我写 -4.35，而行间距算完 r3 在 -4.05
   ⇒ 地面跑到节点上面去了。这是看了真渲染截图才发现的（截图自证不是走过场）。 */
const GROUND_Y = -5.2;
const ROW_Y0 = 1.35, ROW_STEP = 1.98;   // 行距从 2.2 收到 1.98：2.2 时底座那层掉出画面
function cameraAt(t){
  // 极缓的呼吸式偏航（±5°）。数据页不许整板自转（本仓教训：满页数字歪掉＝像排版坏了）
  const yaw = REDUCED ? CAM.yaw0 : CAM.yaw0 + 0.088 * Math.sin(t / 11000);
  return { yaw, pitch: CAM.pitch, dist: CAM.dist, focal: CAM.focal };
}
function makeProjector(cam){
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const k = Math.min(W, H) * CAM.unit;
  const ox = W * 0.5, oy = H * 0.515;
  return function project(x, y, z){
    const x1 =  x * cy + z * sy;
    const z1 = -x * sy + z * cy;
    const y2 =  y * cp - z1 * sp;
    const z2 =  y * sp + z1 * cp;
    const zc = z2 + cam.dist;
    const s = cam.focal / Math.max(1.5, zc);
    return { x: ox + x1 * s * k, y: oy - y2 * s * k, z: zc, s: s * k };
  };
}
/* 大气消光：越远越暗越偏蓝（这是"立体"最便宜也最有效的一招） */
function fog(z, a){
  const k = Math.max(0, Math.min(1, (z - (CAM.dist - 6.5)) / 13));
  return { a: a * (1 - 0.72 * k), tint: k };
}

/* 世界坐标：行号 → 高度；布局 x → 横向 */
function worldOf(n, rowIdx){
  return {
    x: (n.x - 0.5) * 11.4,
    y: ROW_Y0 - rowIdx * ROW_STEP,
    z: 0,
    row: rowIdx,
  };
}
function place(t){
  if (!graph || !graph.layout || !graph.layout.ok) return null;
  const cam = cameraAt(t);
  const project = makeProjector(cam);
  const rows = graph.layout.rows || [];
  const nodes = [];
  rows.forEach(function (r, ri){
    for (const n of r.nodes){
      const w = worldOf(n, ri);
      const p = project(w.x, w.y, w.z);
      const g = project(w.x, GROUND_Y, w.z);          // 落地投影（做光柱与影）
      nodes.push(Object.assign({}, n, { wx: w.x, wy: w.y, row: ri, sx: p.x, sy: p.y, sz: p.z, ss: p.s,
                                       gx: g.x, gy: g.y }));
    }
  });
  nodes.sort(function (a, b){ return b.sz - a.sz; });  // 远的先画 ⇒ 遮挡正确
  /* 标签避让：同一层里按横向排序分三档错开 —— 底座 11 个挤在一行时，
     第一版标签互相压住（截图里读成 `brain...`/`visual corte...` 一坨）。 */
  const byRow = new Map();
  for (const n of nodes){
    if (!byRow.has(n.row)) byRow.set(n.row, []);
    byRow.get(n.row).push(n);
  }
  for (const list of byRow.values()){
    list.sort(function (a, b){ return a.wx - b.wx; });
    list.forEach(function (n, i){ n.lab = i % 3; });
  }
  return { nodes: nodes, project: project, cam: cam };
}

/* ═══════════════ 第 3 层：主画面 —— 只画**硬**的 ═══════════════ */
function drawScene(sc, t, now){
  const pos = new Map(sc.nodes.map(function (n){ return [n.id, n]; }));
  const project = sc.project;

  /* ── 地面网格：真的按透视投出去（纵深感的物理来源）── */
  const gA = 0.105;                                  // 第一版 0.055 太暗 ⇒ 截图里地面几乎不存在
  ctx.lineWidth = 1 * DPR;
  for (let gz = -8; gz <= 8; gz += 1.6){
    const a = project(-10.5, GROUND_Y, gz), b = project(10.5, GROUND_Y, gz);
    const f = fog((a.z + b.z) / 2, gA);
    ctx.strokeStyle = mix('#0a0f22', C.wire, f.tint * 0.55);
    ctx.globalAlpha = f.a;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (let gx = -10.5; gx <= 10.5; gx += 1.75){
    const a = project(gx, GROUND_Y, -8), b = project(gx, GROUND_Y, 8);
    const f = fog((a.z + b.z) / 2, gA);
    ctx.globalAlpha = f.a * 0.85;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  /* 地平线：一条比网格亮的收束线 —— 有它，"这是一个空间"才立得住 */
  const hz1 = project(-11, GROUND_Y, 8.2), hz2 = project(11, GROUND_Y, 8.2);
  const hg = ctx.createLinearGradient(hz1.x, hz1.y, hz2.x, hz2.y);
  hg.addColorStop(0, rgba(C.wire, 0)); hg.addColorStop(0.5, rgba(C.wire, 0.20));
  hg.addColorStop(1, rgba(C.wire, 0));
  ctx.strokeStyle = hg; ctx.lineWidth = 1.2 * DPR;
  ctx.beginPath(); ctx.moveTo(hz1.x, hz1.y); ctx.lineTo(hz2.x, hz2.y); ctx.stroke();

  /* ── 边的硬芯：按深度定粗细与透明度 ── */
  const edges = (graph.layout.edges || []).slice().sort(function (e1, e2){
    const a1 = pos.get(e1.from), b1 = pos.get(e1.to), a2 = pos.get(e2.from), b2 = pos.get(e2.to);
    if (!a1 || !b1 || !a2 || !b2) return 0;
    return ((b1.sz + a1.sz) - (b2.sz + a2.sz));
  });
  for (const e of edges){
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) continue;
    const key = e.from + '→' + e.to;
    const heat = edgeHeat.get(key) || 0;
    const zAvg = (a.sz + b.sz) / 2;
    const f = fog(zAvg, 0.13 + 0.72 * heat);
    const col = heat > 0.05 ? C.wire : C.line;
    const baseW = (heat > 0.05 ? 2.0 : 1.15) * (1 - 0.42 * f.tint);
    ctx.strokeStyle = mix('#0a0f22', col, heat > 0.05 ? 1 : 0.55);
    ctx.globalAlpha = f.a;
    ctx.lineWidth = Math.max(0.9 * DPR, baseW * DPR * (0.75 + 0.35 / Math.max(1, zAvg - CAM.dist + 6)));
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* ── 万能插脉冲：亮头 + 渐隐尾 + 导线局部通电 + 到达充电 ── */
  let inflight = 0;
  for (const p of packets){
    const a = pos.get(p.from), b = pos.get(p.to);
    if (!a || !b) continue;
    const u = (now - p.t0) / p.dur;
    if (u < 0) continue;
    if (u > 1.12) continue;
    inflight++;
    const head = Math.min(1, u);
    const TAIL = 12;                                  // 尾部取样段数（做"电荷尾巴"）
    const zAvg = (a.sz + b.sz) / 2;
    const f = fog(zAvg, 1);
    // 导线局部增亮：只把包"脚下"那一段提亮（通电感，不是整条一起亮）
    const segA = Math.max(0, head - 0.30), segB = Math.min(1, head + 0.02);
    const p1 = project(a.wx + (b.wx - a.wx) * segA, a.wy + (b.wy - a.wy) * segA, 0);
    const p2 = project(a.wx + (b.wx - a.wx) * segB, a.wy + (b.wy - a.wy) * segB, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(C.wire, 0.34 * f.a);
    ctx.lineWidth = 4.6 * DPR * (1 - 0.4 * f.tint);
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    // 尾巴：从头部往回取样，越远越淡越细
    for (let i = TAIL; i >= 0; i--){
      const ui = Math.max(0, head - i * 0.024);
      const pt = project(a.wx + (b.wx - a.wx) * ui, a.wy + (b.wy - a.wy) * ui, 0);
      const k = 1 - i / (TAIL + 1);
      const rr = (1.4 + 3.1 * k * k) * DPR * (1 - 0.35 * f.tint);
      ctx.fillStyle = mix(C.wire, '#ffffff', 0.35 + 0.5 * k);
      ctx.globalAlpha = (0.10 + 0.85 * k * k) * f.a;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, rr, 0, Math.PI * 2); ctx.fill();
    }
    // 亮头（白芯）
    const hp = project(a.wx + (b.wx - a.wx) * head, a.wy + (b.wy - a.wy) * head, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(hp.x, hp.y, 3.6 * DPR * (1 - 0.3 * f.tint), 0, Math.PI * 2); ctx.fill();
    // 快到站 ⇒ 目标节点开始"吃电"（预充：弧先亮一半，到站再补满）
    if (head > 0.72){
      const ch = nodeCharge.get(p.to) || 0;
      nodeCharge.set(p.to, Math.max(ch, (head - 0.72) / 0.28 * 0.3));
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ── 节点：立体球（受光）+ 落地光柱 + 影 + 电量弧 ── */
  for (const n of sc.nodes){
    const st = nodeState.get(n.name) || { state: ST.IDLE };
    const col = stateColor(st.state);
    const f = fog(n.sz, 1);
    const r = (n.kind === 'dimension' ? 9.8 : n.kind === 'capability' ? 7.0 : 5.2) * DPR
            * (0.62 + 0.38 * f.a) * (0.86 + 0.22 * n.ss / (Math.min(W, H) * CAM.unit * 0.9));
    // 落地光柱（从节点到地面的极淡竖线）—— 立体感的一半来自"它站在地上"
    if (n.kind !== 'substrate'){
      const lg = ctx.createLinearGradient(n.sx, n.sy, n.gx, n.gy);
      lg.addColorStop(0, rgba(col, 0.20 * f.a));
      lg.addColorStop(1, rgba(col, 0));
      ctx.strokeStyle = lg; ctx.lineWidth = Math.max(1 * DPR, r * 0.42);
      ctx.beginPath(); ctx.moveTo(n.sx, n.sy); ctx.lineTo(n.gx, n.gy); ctx.stroke();
    }
    // 地面影（压在网格上，让节点"离地"）
    const sh = ctx.createRadialGradient(n.gx, n.gy, 0, n.gx, n.gy, r * 3.1);
    sh.addColorStop(0, rgba(col, 0.20 * f.a)); sh.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = sh;
    ctx.beginPath(); ctx.ellipse(n.gx, n.gy, r * 3.1, r * 1.05, 0, 0, Math.PI * 2); ctx.fill();

    // 本体：受光球（光源在左上）—— 硬芯 + 一圈冷反射边
    const light = { x: -0.42, y: -0.48 };
    const g = ctx.createRadialGradient(n.sx + light.x * r * 0.55, n.sy + light.y * r * 0.55, r * 0.12,
                                       n.sx, n.sy, r * 1.06);
    g.addColorStop(0, mix(col, '#ffffff', 0.58));
    g.addColorStop(0.52, col);
    g.addColorStop(1, mix(col, '#04060e', 0.55));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(n.sx, n.sy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = rgba(C.wire, 0.16 * f.a);
    ctx.lineWidth = 1 * DPR;
    ctx.beginPath(); ctx.arc(n.sx, n.sy, r + 0.6 * DPR, 0, Math.PI * 2); ctx.stroke();

    if (st.state !== ST.IDLE){                       // 活着的节点：一圈硬边（不是渐变）
      ctx.strokeStyle = mix(col, '#ffffff', 0.35); ctx.globalAlpha = f.a;
      ctx.lineWidth = 1.5 * DPR;
      ctx.beginPath(); ctx.arc(n.sx, n.sy, r + 3.4 * DPR, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // 电量弧：这一圈就是"电量冲"的读数（真到达才涨，会自己掉）
    const chg = nodeCharge.get(n.name) || 0;
    if (chg > 0.01){
      ctx.strokeStyle = rgba(C.wire, 0.92 * f.a);
      ctx.lineWidth = 2.2 * DPR;
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r + 5.6 * DPR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, chg));
      ctx.stroke();
      ctx.strokeStyle = rgba('#ffffff', 0.55 * f.a * chg);
      ctx.lineWidth = 1.0 * DPR;
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, r + 6.6 * DPR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, chg));
      ctx.stroke();
    }
    // 标签：等宽数字，跳秒不抖。三层错开（同层内按横向排序分档）—— 密行标签会互相压住。
    const stagger = (n.lab || 0) * 13.5 * DPR;
    const raw = String(n.name);
    const label = raw.length > 13 ? raw.slice(0, 12) + '…' : raw;
    const small = n.kind !== 'dimension' && n.kind !== 'capability';
    ctx.fillStyle = st.state === ST.IDLE
      ? rgba('#c8d4f0', (small ? 0.40 : 0.52) * f.a) : rgba('#ffffff', f.a);
    ctx.font = `${(n.kind === 'dimension' ? 12.5 : small ? 10 : 11) * DPR}px "Microsoft YaHei UI",system-ui`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(label, n.sx, n.sy + r + 5 * DPR + stagger);
  }

  /* ── 层名：贴在地面上的一层（让"分层"这件事有空间位置）── */
  const rows = graph.layout.rows || [];
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (let ri = 0; ri < rows.length; ri++){
    const r = rows[ri];
    if (!r.nodes.length) continue;
    const lab = r.row === 'r0' ? '合一维' : r.row === 'r1' ? '四维' : r.row === 'r2' ? '同层能力' : '底座支撑';
    const p = project(-7.6, ROW_Y0 - ri * ROW_STEP, 0);
    const f = fog(p.z, 1);
    ctx.fillStyle = rgba('#7886aa', 0.62 * f.a);
    ctx.font = `${11 * DPR}px var(--mono)`;
    ctx.fillText(lab, p.x, p.y);
  }
  document.getElementById('pkt').textContent = String(inflight);
}

/* ═══════════════ 第 4 层：后处理 —— 全图辉光 + 帧反馈残影 ═══════════════ */
function post(t){
  // 残影：不清屏，用背景色低透明度覆盖 ⇒ 亮过的地方慢慢退（运动模糊）
  tctx.globalCompositeOperation = 'source-over';
  tctx.fillStyle = REDUCED ? '#04060e' : 'rgba(4,6,14,0.40)';
  tctx.fillRect(0, 0, W, H);
  tctx.drawImage(cv, 0, 0);

  // 主画面：背景 + 残影层
  ctx.globalCompositeOperation = 'source-over';
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#04060e'); bg.addColorStop(0.62, '#080d1e'); bg.addColorStop(1, '#0a0f22');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(trail, 0, 0);

  // 辉光：把"硬画面"整体模糊两趟再叠加 —— 这才是真的 bloom
  if (!REDUCED){
    gctx.clearRect(0, 0, W, H);
    gctx.filter = `blur(${Math.round(9 * DPR)}px)`;
    gctx.drawImage(trail, 0, 0);
    gctx.filter = 'none';
    ctx.globalAlpha = 0.40; ctx.drawImage(glow, 0, 0);
    ctx.globalAlpha = 0.20;
    gctx.clearRect(0, 0, W, H);
    gctx.filter = `blur(${Math.round(26 * DPR)}px)`;
    gctx.drawImage(trail, 0, 0);
    gctx.filter = 'none';
    ctx.drawImage(glow, 0, 0);
    ctx.globalAlpha = 1;
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ═══════════════ 主循环 ═══════════════ */
let lastLive = 0;
function frame(t){
  if (!graph){ requestAnimationFrame(frame); return; }

  // 每帧衰减热度（真事件退去，电流自己消失）
  for (const [k, v] of edgeHeat){
    const nv = v * 0.972;
    if (nv < 0.02) edgeHeat.delete(k); else edgeHeat.set(k, nv);
  }
  stepPackets(performance.now());

  requestAnimationFrame(frame);
  const sc = place(t);
  if (!sc || !sc.nodes.length) return;

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0, 0, W, H);
  drawScene(sc, t, performance.now());
  post(t);

  // 拉真实事件（增量）
  // 刷新节奏：10s（专业分层刷新 L3 建议值）。原来写 1500ms —— 比它快 6.7 倍，
  // 是纯浪费：五维脑的执行事件本来就不是秒级抖动的量，机器还要留给别的事。
  if (t - lastLive > 10000){
    lastLive = t;
    apiGet()
      .then(j => {
        if (j && j.structure) graph = { layout: j.layout, structure: j.structure, live: j.live };
        applyLive(j.live);
        renderMeta(j);
      })
      .catch(e => showWarn(e));
  }
}

/* ── 数据口：同源 → 本机回环直连（兜底）────────────────────────────────
   为什么要兜底：DSH 宿主里 `/gbt-master/api/*` 的内嵌反代**当前不生效**
   （实测 HTTP 404「该路径不在可服务白名单内」—— 宿主进程自 09-21 22:29 起未重启，
    加载的是没有那段代码的旧插件）。从面板端口(8765)直接打开时走同源那条即可；
   在宿主内则落到本机直连，靠面板服务的 CORS 放行
   （只放 127.0.0.1:3080 / localhost:3080，**不是通配**）。
   两条都失败 ⇒ 如实报「拿不到」，**不画假图**。

   同源那条要按**当前处在哪个源**算（实测教训）：在宿主里页面挂在 /gbt-master/fs/… 下，
   必须走 `/gbt-master/api/…`；写裸 `/api/…` 打到的是 DSH 自己的口，要鉴权，实测回 401。
   在面板端口 8765 上直接打开时，裸 `/api/…` 才是对的。 */
const UNDER_HOST = location.pathname.indexOf('/gbt-master/') === 0;
const API_BASE = (UNDER_HOST ? '/gbt-master' : '') + '/api/brain-graph?limit=250';
const API_URLS = [API_BASE, 'http://127.0.0.1:8765/api/brain-graph?limit=250'];
let apiIdx = 0;   /* 记住上次走通的那条：本页 10s 轮询一次，不记住就一天白发 8640 发 404 */
function apiGet(){
  const tryAt = (i) => fetch(API_URLS[i], {cache:'no-store'})
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + API_URLS[i]); return r.json(); })
    .then(j => { apiIdx = i; return j; })
    .catch(e => { if (i + 1 < API_URLS.length) return tryAt(i + 1); throw e; });
  return tryAt(apiIdx);
}

/* ── 诚实：拿不到就说拿不到 ── */
function showWarn(e){
  const w = document.getElementById('warn');
  w.style.display = 'block';
  w.innerHTML = '拿不到大脑执行层数据。<br>原因：<code>' + String(e.message || e) + '</code>'
    + '<br><br>两条路都试过了：同源 <code>/api/brain-graph</code> 与本机直连 '
    + '<code>http://127.0.0.1:8765/api/brain-graph</code>。'
    + '<br>先确认面板服务起着 —— <code>holo_pet\\start-holo-panel.bat</code>'
    + '（或 <code>py -3.14 holo_pet\\panel_server.py</code>），再刷新本页。';
}
function renderMeta(j){
  const s = (j && j.structure) || {}, L = (j && j.layout) || {}, lv = (j && j.live) || {};
  document.getElementById('src').textContent =
    `结构：五维 ${s.counts ? s.counts.dimensions : '?'} · 同层 ${s.counts ? s.counts.peer : '?'}`
    + ` · 底座 ${s.counts ? s.counts.substrate : '?'} · 边 ${s.counts ? s.counts.edges : '?'}`
    + `　|　布局 ${L.algorithm || '?'}（${L.counts ? L.counts.rows : '?'} 层）`
    + `　|　真实事件 ${lv.count ?? 0} 条`;
  const undrawn = (s.chain_evidence || []).filter(c => c.drawn === false).map(c => c.pair);
  document.getElementById('note').innerHTML =
    (undrawn.length
      ? `注册表声称的链 <code>${undrawn.join(' / ')}</code> <b>在源码里查不到实调</b> —— 所以本图<b>不画这三条</b>。`
      : '')
    + `<div id="motion-note" style="margin-top:6px">检测到"减少动态效果"偏好：已关掉辉光、残影与电流动画，只保留静态立体画面。</div>`;
}

apiGet()
  .then(j => {
    if (!j || !j.layout || !j.layout.ok) throw new Error('布局不可用（errors: ' + JSON.stringify(j && j.errors) + '）');
    graph = { layout: j.layout, structure: j.structure, live: j.live };
    applyLive(j.live);
    renderMeta(j);
    requestAnimationFrame(frame);
  })
  .catch(e => { showWarn(e); requestAnimationFrame(frame); });
</script>
