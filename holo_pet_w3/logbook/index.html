<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>GBT小土豆V8 · 记录本（重启不失忆 · 只追加 · 自链哈希）</title>
<!--
  记录本面板 · 窗口 L · 批次 W15 · 2026-10-07
  主人令（逐字）：「给她设计一个记录本，不管做什么都要在里面有记录，防止重启之后大模型不知道，
    比如每天扫描扫过哪里、修改过哪里、新增了哪里，全部都要有记录。」
  本页只说三件事：① 链有没有断（自链哈希）② 最近做过什么（append 的手记）
    ③ 每天扫了什么、改了什么、新增了什么、删了什么（文件指纹现算，不是回忆）。
  数据：logbook-data.js（logbook.py render 生成）—— 只读，不取网络、不 fetch、零外部引用。
-->
<style>
:root{--bg:#07090d;--pan:#0d1117;--line:#1d2635;--ink:#e6edf7;--dim:#8b97a8;
 --cy:#22d3ee;--or:#f5b041;--ok:#34d399;--bad:#f87171;--brand-or:#f5b041;--brand-cy:#22d3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 "Segoe UI",system-ui,sans-serif}
.gbt-topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);
 background:linear-gradient(90deg,#0b1017,#0d1117);flex-wrap:wrap}
.mark{width:18px;height:18px;flex:0 0 auto;background:url(../build/tray-logo-32.png) center/contain no-repeat}
.brand{font-weight:700;letter-spacing:.5px}.brand b{color:var(--brand-or)}
.note{color:var(--dim);font-size:11.5px}
.wrap{padding:14px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:12px}
h2{margin:0 0 8px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.4px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{min-width:104px}.stat b{display:block;font-size:24px;color:var(--brand-cy);font-variant-numeric:tabular-nums}
.stat i{font-style:normal;color:var(--dim);font-size:12px}
.chain{border-radius:8px;padding:8px 10px;font-size:12.5px;border:1px solid var(--line)}
.chain.ok{border-color:#1c5138;background:#0a1a12;color:var(--ok)}
.chain.bad{border-color:#5c2020;background:#1a0a0a;color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:11.5px}
th,td{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600;background:#0b1017;position:sticky;top:0}
tbody tr:hover td{background:#101722}
.mono{font-family:ui-monospace,Consolas,monospace}
.k{display:inline-block;border-radius:999px;padding:0 7px;font-size:10.5px;border:1px solid var(--line);color:var(--dim)}
.k.scan{border-color:#26445a;color:var(--brand-cy)}
.k.change{border-color:#5a4a1e;color:var(--brand-or)}
.k.deliver{border-color:#1c5138;color:var(--ok)}
.k.decision{border-color:#3b2f5c;color:#b39ddb}
.k.note{border-color:#333c4d;color:var(--dim)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.add{color:var(--ok)}.mod{color:var(--brand-or)}.del{color:var(--bad)}
.base{color:var(--dim);font-style:italic}
.samples{margin:4px 0 0;padding-left:16px;color:var(--dim);font-size:11px}
.empty{color:var(--dim);padding:10px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style></head><body>
<div class="gbt-topbar"><span class="mark"></span>
 <span class="brand">GBT<b>小土豆</b>V8 · 记录本</span>
 <span class="note" id="gen">…</span></div>

<div class="wrap">
  <div class="card">
    <h2>链状态（只追加 · 自链哈希：改过一行就会断在这里）</h2>
    <div class="chain" id="chain">…</div>
  </div>

  <div class="card">
    <h2>总量</h2>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <h2>扫描史（每天扫过哪里 · 改了什么 · 新增了什么 —— 文件指纹现算，不是回忆）</h2>
    <div id="scans"></div>
  </div>

  <div class="card">
    <h2>最近动作（不管做什么都记在这里）</h2>
    <div id="records"></div>
  </div>
</div>

<script src="logbook-data.js"></script>
<script>
(function () {
  var D = window.GBT_LOGBOOK;
  var $ = function (id) { return document.getElementById(id); };
  if (!D) { $("chain").textContent = "读不到 logbook-data.js —— 跑 render 重新生成"; return; }

  $("gen").textContent = "生成 " + D.generated_at + " · 源 state/logbook.jsonl · 重生成 " + D.regen;

  var c = $("chain");
  c.className = "chain " + (D.chain.ok ? "ok" : "bad");
  c.textContent = (D.chain.ok ? "✅ " : "❌ ") + D.chain.detail;

  var t = D.totals;
  $("stats").innerHTML = [
    ["记录", t.records], ["扫描", t.scans], ["改动", t.changes],
    ["决策", t.decisions], ["交付", t.delivers]
  ].map(function (p) {
    return '<div class="stat"><b>' + p[1] + '</b><i>' + p[0] + '</i></div>';
  }).join("");

  var scans = (D.scans || []).slice().reverse();
  if (!scans.length) {
    $("scans").innerHTML = '<div class="empty">还没有扫描记录 —— 跑 logbook.py scan</div>';
  } else {
    $("scans").innerHTML = '<table><thead><tr><th>时刻</th><th>标签</th><th class="num">扫到</th>'
      + '<th class="num">未变</th><th class="num">新增</th><th class="num">改动</th><th class="num">删除</th>'
      + '<th>样例（最多 6 条）</th></tr></thead><tbody>'
      + scans.map(function (s) {
          var head = s.baseline
            ? '<span class="base">建基线（首扫无旧快照）</span>'
            : ["新增", "改动", "删除"].map(function (k, i) {
                var key = ["added", "modified", "deleted"][i];
                var n = s[key] || 0;
                if (!n) return "";
                var arr = (s.samples && s.samples[key]) || [];
                return '<div class="' + ["add", "mod", "del"][i] + '">' + k + " " + n
                  + '</div><ul class="samples">'
                  + arr.slice(0, 6).map(function (p) { return "<li class=\"mono\">" + p + "</li>"; }).join("")
                  + "</ul>";
              }).join("") + (s.truncated ? '<div class="del">⚠ 本次扫描触顶被截断</div>' : "");
          var cells = ["scanned", "unchanged", "added", "modified", "deleted"].map(function (k) {
            return '<td class="num">' + (s[k] === null || s[k] === undefined ? "—" : s[k]) + "</td>";
          }).join("");
          return "<tr><td class='mono'>" + String(s.ts).slice(0, 19) + "</td><td>" + (s.label || "")
            + "</td>" + cells + "<td>" + head + "</td></tr>";
        }).join("") + "</tbody></table>";
  }

  var recs = (D.records || []).slice().reverse();
  if (!recs.length) {
    $("records").innerHTML = '<div class="empty">还没有记录</div>';
  } else {
    $("records").innerHTML = '<table><thead><tr><th class="num">#</th><th>时刻</th><th>类型</th>'
      + '<th>谁</th><th>做了什么</th><th>涉及</th><th>链</th></tr></thead><tbody>'
      + recs.map(function (r) {
          var where = (r.where || []).map(function (w) { return '<span class="mono">' + w + "</span>"; }).join("<br>");
          return "<tr><td class='num mono'>" + r.n + "</td><td class='mono'>" + String(r.ts).slice(0, 19)
            + "</td><td><span class='k " + r.kind + "'>" + r.kind + "</span></td><td>" + (r.actor || "")
            + "</td><td>" + r.what + "</td><td>" + where + "</td><td class='mono note'>"
            + (r.prev || "") + " → " + (r.hash || "") + "</td></tr>";
        }).join("") + "</tbody></table>";
  }
})();
</script>
</body></html>
