<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>GBT小土豆V8 · 触手活动流</title>
<!-- GBT小土豆V8 · 触手活动流（主人令 2026-10-04：「触手她都不活动的吗？」）
     干什么：读**真账本**（gbt_allinone/store/audit.jsonl）尾部 —— 谁在动、动了几次、成没成；
     并给一个**心跳派活**开关（按轮换给只读能力位派活，让触手真动起来、账本可见）。
     口径：**不编活动**（没调用就如实显「静默」）；写类能力永不自动派（要票的活只由主人发）。
     开发者：自由的风 · GBT小土豆V8 · 本署名不可删除、不可篡改归属 -->
<style>
:root{--bg:#06080c;--pan:#0c1118;--line:#1c2634;--ink:#e7eef8;--dim:#8794a6;--cy:#22d3ee;--or:#f5b041;--ok:#34d399;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 "Segoe UI",system-ui,sans-serif}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.mark{width:16px;height:16px;flex:0 0 auto;background:url(../build/tray-logo-32.png) center/contain no-repeat}
.brand{font-weight:700}.brand b{color:var(--or)}
.grow{flex:1}
.btn{border:1px solid var(--line);background:#0e141d;color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer}
.btn.on{border-color:#2f7d5c;color:var(--ok)}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:12px}
h2{margin:0 0 8px;font-size:12.5px;color:var(--dim);font-weight:600}
.stat{display:flex;gap:20px;flex-wrap:wrap;margin:4px 0 10px}
.stat b{display:block;font-size:22px;color:var(--cy);font-variant-numeric:tabular-nums}
.stat i{font-style:normal;color:var(--dim);font-size:11.5px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left}
th{color:var(--dim);font-weight:600}
.mono{font-family:ui-monospace,Consolas,monospace}
.ok{color:var(--ok)}.bad{color:var(--bad)}.dim{color:var(--dim)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.bar{height:6px;background:#12202c;border-radius:3px;overflow:hidden;min-width:70px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--cy)}
</style></head><body>
<div class="top">
  <span class="mark"></span><span class="brand">GBT<b>小土豆</b>V8 · 触手活动流</span>
  <span class="dim" id="src">真账本：gbt_allinone/store/audit.jsonl</span>
  <span class="grow"></span>
  <button class="btn" id="hb">● 心跳派活（关）</button>
</div>
<div class="wrap">
  <div class="card">
    <h2>// 01 — 总量与活跃位（近 400 条账本）</h2>
    <div class="stat" id="stats"></div>
    <table><thead><tr><th>能力位</th><th>调用数</th><th>占比</th></tr></thead><tbody id="counts"></tbody></table>
  </div>
  <div class="card">
    <h2>// 02 — 最近活动（账本尾部 · 实时刷新）</h2>
    <table><thead><tr><th>时刻</th><th>能力位</th><th>事件</th><th>结果</th></tr></thead><tbody id="tail"></tbody></table>
    <p class="dim" id="note">没活动就是静默 —— 这里**不编**。</p>
  </div>
</div>
<script>
(function () {
  var api = window.gbtW3;
  var stats = document.getElementById("stats"), counts = document.getElementById("counts");
  var tail = document.getElementById("tail"), note = document.getElementById("note");
  var src = document.getElementById("src"), hbBtn = document.getElementById("hb");
  var hbOn = false, lastRound = null;

  function esc(s) { return String(s == null ? "" : s); }

  function refresh() {
    if (!api || typeof api.capActivity !== "function") {
      note.textContent = "壳动作口没加载（不在面板里？）"; return;
    }
    api.capActivity().then(function (d) {
      if (!d || !d.ok) { note.textContent = "读账本失败（如实报）：" + ((d && d.error) || "未知"); return; }
      src.textContent = "真账本：" + d.ledger + " · 现读 " + d.at.slice(11, 19);
      var total = d.total || 0, rowsN = (d.tail || []).length;
      var activeKinds = (d.counts || []).filter(function (c) { return c.n > 0; }).length;
      stats.innerHTML =
        "<div><b>" + total.toLocaleString() + "</b><i>账本总条数</i></div>" +
        "<div><b>" + activeKinds + "</b><i>近 400 条里有活动的位</i></div>" +
        "<div><b>" + ((d.counts[0] && d.counts[0].kind) || "—") + "</b><i>最活跃</i></div>";
      var max = (d.counts[0] && d.counts[0].n) || 1;
      counts.innerHTML = (d.counts || []).map(function (c) {
        var w = Math.round(100 * c.n / max);
        return "<tr><td class='mono'>" + esc(c.kind) + "</td><td>" + c.n + "</td>" +
               "<td><span class='bar'><i style='width:" + w + "%'></i></span> " + w + "%</td></tr>";
      }).join("") || "<tr><td colspan=3 class='dim'>近 400 条里没有任何带 kind 的调用</td></tr>";
      tail.innerHTML = rowsN ? (d.tail || []).map(function (r) {
        var res = r.ok === null ? "<span class='dim'>—</span>"
                : (r.ok ? "<span class='ok'>ok</span>" : "<span class='bad'>失败</span>");
        return "<tr><td class='mono'>" + esc((r.iso || "").slice(11, 19)) + "</td>" +
               "<td class='mono'>" + (r.kind ? "<span class='pulse'></span>" + esc(r.kind) : "<span class='dim'>—</span>") + "</td>" +
               "<td>" + esc(r.event) + "</td><td>" + res + "</td></tr>";
      }).join("") : "<tr><td colspan=4 class='dim'>账本尾部读不到</td></tr>";
      note.textContent = hbOn
        ? "心跳在跑（只派**只读**能力位：health / llm_status / tentacle见 / task_manager / selfscan）—— 这里应能看到新条目滚动。"
        : "心跳关着：活动只来自真实调用（例如「触手视觉回传」页每 1.2 秒取一帧）。要主动派活就点右上角。";
    }).catch(function (e) { note.textContent = "异常：" + e; });
  }

  if (hbBtn) hbBtn.addEventListener("click", function () {
    if (!api || typeof api.heartbeat !== "function") { note.textContent = "壳动作口没加载"; return; }
    hbOn = !hbOn;
    hbBtn.className = "btn" + (hbOn ? " on" : "");
    hbBtn.textContent = hbOn ? "● 心跳派活（开）" : "● 心跳派活（关）";
    api.heartbeat({ on: hbOn }).then(function (r) {
      note.textContent = r && r.on ? ("心跳已开 · 轮换：" + (r.caps || []).join(" / "))
                                   : "心跳已停";
      refresh();
    });
  });

  refresh();
  setInterval(refresh, 2500);
})();
</script>
</body></html>
