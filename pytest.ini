[pytest]
# ─────────────────────────────────────────────────────────────────────────────
# 这个文件的第一作用是**当 rootdir 锚**（不是配置本身）。
#
# 🔴 为什么必须存在（2026-09-24 实测，不是设想）：
#   仓根原本**一个测试口径文件都没有** ⇒ pytest 从仓根向上走到 `C:\Users\ADMIN\`，
#   捡到那边一份**别的项目**的 `pyproject.toml`（`gbt-xiaotudou` v5.0）当配置：
#       rootdir:    C:\Users\ADMIN          ← 被劫持到 HOME
#       configfile: pyproject.toml
#   后果：rootdir 跑到 HOME 之后，pytest 的默认 norecursedirs **不再排除本仓的 vendor/**，
#   于是它走进第三方 vendored 代码（`vendor\pylibs\win32comext\...`）：
#       **7327 tests collected, 251 errors in 43.41s**
#   ⇒ 加入本文件后 rootdir 钉回仓根，`testpaths` 只收三个真测试目录。
#
# 改前/改后读数（`py -3.14 -m pytest --collect-only -q`）：
#   改前：rootdir=C:\Users\ADMIN · configfile=pyproject.toml · 7327 collected / 251 errors
#   改后：rootdir=<仓根>          · configfile=pytest.ini     · 见 report（同一条命令复跑）
# ─────────────────────────────────────────────────────────────────────────────

# 只收仓内三个**真**测试目录（`.scratch/` 下那几个 tests 是作业残骸，不收）
testpaths =
    gbt_allinone/tests
    holo_pet/tests
    holo_pet_w3/tests

# 明确排掉：作业残骸 / 备份 / 第三方 / 构建产物（rootdir 正常后这些其实已被默认排除，
# 但显式写出来是为了"不靠默认值"——默认值会随 rootdir 变）
norecursedirs =
    .*
    _*
    .git
    .scratch
    .backups
    .trash
    vendor
    node_modules
    dist
    build
    __pycache__

# 不写 .pytest_cache（本仓的作业临时面已经够大了，不再加料）
addopts = -p no:cacheprovider
