function render(d){
  document.getElementById('at').textContent = (d && d.at) || '-';
  document.getElementById('pages').innerHTML = (PAGES||[]).map(p=>li(
    '<b>'+p.page+'</b> <span class="'+(p.exists?'ok':'bad')+'">'+(p.exists?'可见':'缺')+'</span> · '+
