<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/ui/favicon.svg" type="image/svg+xml">
<title>GBT小土豆量化收益平台 · 消息</title>
<meta name="description" content="GBT小土豆量化收益平台 · 消息中心 — AI 客服、平台公告与用户私信">
<style>
/* ============================================================
   GBT 消息中心 v2 · iMe Messenger 风格 × 平台品牌令牌
   设计: 三段式布局(会话+频道+对话流), 表情选择器, 红包, 群聊, 钱包内嵌
   ============================================================ */
:root{
  --bg:#080d15; --sidebar:#0c1320; --chat:#0e1826; --input:#0a1320;
  --line:rgba(148,163,184,.12); --txt:#eef2fb; --mut:#8ea0bd; --dim:#5b6b85;
  --cy:#38e1ff; --cy2:#0ea5e9; --gold:#f6c76a; --grn:#3ddc97; --red:#ff7a8f; --pur:#a78bfa;
  --mono:ui-monospace,'SFMono-Regular',Consolas,monospace;
  --bubble-in:#152236; --bubble-out:#0d5470;
  --glow:rgba(56,225,255,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:400 14px/1.6 'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;overflow:hidden}
.app{display:flex;height:100vh;position:relative}
/* v3 美化: 全局氛围光 */
.app::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 400px at 80% -10%,rgba(56,225,255,.06),transparent 60%),radial-gradient(500px 400px at -10% 100%,rgba(246,199,106,.04),transparent 55%);z-index:0}
.app>*{position:relative;z-index:1}

/* ===== 左栏: 会话 + 频道 ===== */
.sidebar{width:320px;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none;backdrop-filter:blur(12px)}
.side-head{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(56,225,255,.04),transparent)}
.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#031318;background:linear-gradient(135deg,var(--cy),var(--cy2) 55%,var(--gold));flex:none;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform 200ms ease-out}
.mark:hover{transform:scale(1.06) rotate(-3deg)}
.side-head .t{font-size:15px;font-weight:700;color:var(--txt)}
.side-head .s{font-size:10px;color:var(--dim);letter-spacing:2px;margin-top:1px}
.search{margin:12px 16px;background:var(--input);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:13px;color:var(--dim);display:flex;align-items:center;gap:8px;transition:border-color 150ms ease-out,box-shadow 150ms ease-out;cursor:text}
.search:hover{border-color:rgba(56,225,255,.25)}
.search:focus-within{border-color:var(--cy);box-shadow:0 0 0 3px var(--glow)}
.sect{font-size:11px;color:var(--dim);letter-spacing:2px;padding:12px 16px 6px;text-transform:uppercase}
.conv-list{flex:1;overflow-y:auto;padding:0 8px 8px}
.conv{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;cursor:pointer;transition:background 120ms ease-out,transform 100ms ease-out;position:relative}
.conv:hover{background:rgba(56,225,255,.06)}
.conv:hover:not(.active){transform:translateX(2px)}
.conv.active{background:linear-gradient(135deg,rgba(56,225,255,.13),rgba(56,225,255,.05));border:1px solid rgba(56,225,255,.2)}
.conv.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;border-radius:999px;background:var(--cy)}
.av{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;color:#031318;position:relative;box-shadow:0 3px 12px rgba(0,0,0,.3);transition:transform 150ms ease-out}
.conv:hover .av{transform:scale(1.05)}
.av::after{content:"";position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;border-radius:999px;background:var(--grn);border:2.5px solid var(--sidebar)}
.meta{flex:1;min-width:0}
.name{font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.last{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.badge-n{background:linear-gradient(135deg,var(--red),#ff5c73);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:999px;display:grid;place-items:center;padding:0 5px;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.35)}

/* ===== 右栏: 对话流 ===== */
.chat{flex:1;display:flex;flex-direction:column;background:var(--chat);position:relative}
.chat-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(56,225,255,.03),transparent);backdrop-filter:blur(8px)}
.chat-head .members{font-size:11px;color:var(--mut)}
.chat-head .status{font-size:11px;color:var(--grn);display:flex;align-items:center;gap:6px;margin-left:auto}
.chat-head .status::before{content:"";width:7px;height:7px;border-radius:999px;background:var(--grn)}

.msg-list{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:8px}
.msg-list::-webkit-scrollbar{width:5px}
.msg-list::-webkit-scrollbar-thumb{background:rgba(148,163,184,.2);border-radius:999px}
.msg-list::-webkit-scrollbar-track{background:transparent}
.conv-list::-webkit-scrollbar{width:4px}
.conv-list::-webkit-scrollbar-thumb{background:rgba(148,163,184,.15);border-radius:999px}
.day-sep{align-self:center;font-size:11px;color:var(--dim);background:rgba(148,163,184,.08);padding:4px 14px;border-radius:999px;margin:10px 0}
.msg-wrap{align-self:flex-start;max-width:72%;display:flex;flex-direction:column}
.msg-wrap.out{align-self:flex-end;align-items:flex-end}
.msg{background:var(--bubble-in);padding:10px 14px;border-radius:18px;font-size:13.5px;line-height:1.55;word-break:break-word;border-bottom-left-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15);animation:msgIn 250ms ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-wrap.out .msg{background:linear-gradient(135deg,var(--bubble-out),#0a6b85);border-bottom-left-radius:18px;border-bottom-right-radius:6px;box-shadow:0 2px 12px rgba(14,90,114,.3)}
.msg .sender{font-size:11px;color:var(--gold);font-weight:700;margin-bottom:3px}
.msg .time{font-size:10px;color:var(--dim);margin-top:3px;text-align:right;font-family:var(--mono)}
.msg-wrap.out .msg .time{color:rgba(238,242,251,.45)}
.msg .reacts{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.msg .react{background:rgba(56,225,255,.15);border:1px solid rgba(56,225,255,.3);border-radius:999px;font-size:11px;padding:2px 8px;cursor:pointer;display:flex;gap:3px;align-items:center}
.msg .react:hover{background:rgba(56,225,255,.3)}
.msg.tip{background:linear-gradient(135deg,rgba(255,122,143,.15),rgba(246,199,106,.15));border:1px solid rgba(255,122,143,.25);border-radius:18px;position:relative;overflow:hidden}
.msg.tip::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.05) 50%,transparent 60%);animation:none}

.msg.tip .tip-amt{font-size:18px;font-weight:800;color:var(--gold);font-family:var(--mono);text-shadow:0 0 20px rgba(246,199,106,.4)}
.msg.tip .tip-btn{background:linear-gradient(135deg,var(--red),#e8556d);color:#fff;border:0;border-radius:10px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px;box-shadow:0 3px 10px rgba(0,0,0,.3);transition:transform 120ms ease-out,filter 120ms ease-out}
.msg.tip .tip-btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.typing{align-self:flex-start;font-size:12px;color:var(--mut);padding:8px 14px;font-style:italic}

/* ===== 输入栏 ===== */
.chat-input-bar{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.emoji-btn,.attach-btn{width:42px;height:42px;border:1px solid var(--line);background:var(--input);border-radius:14px;color:var(--mut);font-size:19px;cursor:pointer;flex:none;display:grid;place-items:center;transition:all 150ms ease-out}
.emoji-btn:hover,.attach-btn:hover{color:var(--gold);border-color:rgba(246,199,106,.5);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.3)}
.emoji-btn:active,.attach-btn:active{transform:scale(.95)}
.chat-input-bar textarea{flex:1;min-height:40px;max-height:120px;resize:none;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:9px 14px;color:var(--txt);font:inherit;font-size:13.5px}
.chat-input-bar textarea:focus-visible,.emoji-btn:focus-visible,.attach-btn:focus-visible,.send-btn:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.send-btn{width:46px;height:46px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--cy),var(--cy2));color:#031318;font-size:19px;cursor:pointer;flex:none;display:grid;place-items:center;transition:all 150ms ease-out;box-shadow:0 4px 14px rgba(56,225,255,.22)}
.send-btn:hover{filter:brightness(1.15);transform:translateY(-1px);box-shadow:0 6px 18px rgba(56,225,255,.28)}
.send-btn:active{transform:scale(.95)}

/* ===== 表情面板 ===== */
.emoji-panel{position:fixed;bottom:70px;right:20px;width:310px;background:rgba(12,19,32,.95);border:1px solid rgba(56,225,255,.2);border-radius:18px;padding:16px;z-index:50;display:none;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(56,225,255,.05);backdrop-filter:blur(20px);animation:panelIn 200ms ease-out}
@keyframes panelIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.emoji-panel.open{display:block}
.emoji-panel .tabs{display:flex;gap:6px;margin-bottom:10px}
.emoji-panel .tab{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mut);cursor:pointer;background:transparent}
.emoji-panel .tab.active{background:rgba(56,225,255,.15);color:var(--cy);border-color:var(--cy)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emoji-grid span{font-size:24px;text-align:center;cursor:pointer;padding:5px;border-radius:10px;transition:all 100ms ease-out}
.emoji-grid span:hover{background:rgba(56,225,255,.18);transform:scale(1.25)}
.emoji-grid span:active{transform:scale(.9)}
.paper-plane{width:18px;height:18px;transform:rotate(-45deg);background:var(--cy);clip-path:polygon(0 0,100% 50%,0 100%,30% 50%)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (hover:none){.conv:hover{border-color:transparent}}
@media (max-width:640px){.sidebar{width:70px}.sidebar .meta,.sidebar .side-head .t,.sidebar .side-head .s,.search,.sect{display:none}.sidebar .conv{justify-content:center}}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:6px;padding:8px 16px;background:rgba(8,12,20,.92);border-top:1px solid rgba(148,163,184,.12)}
.tabbar a{display:inline-flex;align-items:center;gap:6px;color:var(--mut);text-decoration:none;padding:9px 16px;border-radius:10px;font-size:12.5px}
.tabbar a:hover{color:var(--txt)}
.tabbar a.on{color:var(--gold)}
main{padding-bottom:46px}
</style>
</head>

<script>
(function(){
"use strict";
var API = location.protocol === "file:" ? "http://127.0.0.1:8097" : "";
var uid = "me";
var EMOJI = {
  cute:["🥹","🫠","🫥","🥲","🫶","🤌","🫰","🫵","🦦","🦫","🐨","🥸","🤠","🥳","🫂","🪄","🧿","🪬","🤩","🥰"],
  business:["💼","📊","💹","🏦","💳","🪙","💎","🏆","🎯","📈","⛓️","🛡️","⚡","🔥","🚀","💡","🔐","⚖️"],
  gbt:["🥔","💪","🚀","💰","✨","🎯","🏆","📊","💱","🔐","🫶","🥹"]
};
var currentTab = "cute";
var currentChat = {type:"support", id:"SUPPORT", name:"GBT 平台客服", color:"#38e1ff"};

var dms = [
  {type:"support", id:"SUPPORT", name:"GBT 平台客服", color:"#38e1ff", last:"在线 · AI 客服", unread:0},
  {type:"dm", id:"alice", name:"Alice", color:"#3ddc97", last:"你好，想兑换 100 USDT", unread:1},
  {type:"dm", id:"bob", name:"Bob", color:"#ff7a8f", last:"到账时间一般多久？", unread:0},
];
var groups = [
  {type:"group", id:"GRP-quant", name:"量化交流群", color:"#f6c76a", last:"Bob: 今天 BTC 走势如何？", unread:3, members:12},
  {type:"group", id:"GRP-vip", name:"VIP 大户群", color:"#a78bfa", last:"管理员: 今晚结算", unread:0, members:48},
];
var channels = [
  {type:"channel", id:"CH-announce", name:"平台公告", color:"#38e1ff", last:"系统升级完成", unread:2},
];

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function ts2time(t){var d=new Date(t*1000);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}

function renderConv(listId, items){
  var html = "";
  items.forEach(function(c){
    html += '<div class="conv'+(c.id===currentChat.id?" active":"")+'" data-type="'+c.type+'" data-id="'+esc(c.id)+'">'
      + '<div class="av" style="background:'+c.color+'">'+esc(c.name.charAt(0))+'</div>'
      + '<div class="meta"><div class="name"><span>'+esc(c.name)+'</span>'
      + (c.unread?'<span class="badge-n">'+c.unread+'</span>':'')
      + '</div><div class="last">'+esc(c.last)+'</div></div></div>';
  });
  $(listId).innerHTML = html;
  $(listId).querySelectorAll(".conv").forEach(function(el){
    el.addEventListener("click", function(){
      var all = dms.concat(groups).concat(channels);
      var c = all.find(function(x){return x.type===el.dataset.type && x.id===el.dataset.id;});
      if(c) openChat(c);
    });
  });
}
function renderAll(){renderConv("dmList",dms);renderConv("grpList",groups);renderConv("chList",channels);}

function openChat(c){
  currentChat = c;
  $("chatHead").innerHTML = '<span style="font-size:15px;font-weight:700">'+esc(c.name)+'</span>'
    + (c.members ? '<span class="members">'+c.members+' 人</span>' : '')
    + '<span class="status">'+(c.type==="support"?"在线 · AI":"在线")+'</span>';
  renderAll();
  loadMessages();
}

function loadMessages(){
  var list = $("msgList");
  list.innerHTML = '<div class="day-sep">今天</div>';
  if(currentChat.type==="support"){
    addMsg("in","GBT 平台客服","您好，我是 GBT 平台 AI 客服。有什么可以帮您？");
  } else if(currentChat.type==="channel"){
    addMsg("in",currentChat.name,"📢 系统升级完成，服务正常。");
  } else if(currentChat.type==="group"){
    addMsg("in","Alice","大家好，今天 BTC 走势如何？");
    addMsg("in","Bob","看涨，动量很强。","🙌");
  } else {
    addMsg("in",currentChat.name,"（演示会话）你好！");
  }
}

function addMsg(role, sender, text, react){
  var list = $("msgList");
  var wrap = document.createElement("div");
  wrap.className = "msg-wrap " + (role==="out"?"out":"in");
  var div = document.createElement("div");
  div.className = "msg";
  if(role==="in" && currentChat.type==="group"){ div.innerHTML = '<div class="sender">'+esc(sender)+'</div>'; }
  div.innerHTML += esc(text).replace(/\n/g,"<br>");
  if(react){ div.innerHTML += '<div class="reacts"><span class="react">'+react+' 1</span></div>'; }
  div.innerHTML += '<div class="time">'+ts2time(Date.now()/1000)+'</div>';
  wrap.appendChild(div);
  list.appendChild(wrap);
  list.scrollTop = list.scrollHeight;
  return div;
}

function addTipMsg(role, amount, currency, note, claimed){
  var list = $("msgList");
  var wrap = document.createElement("div");
  wrap.className = "msg-wrap " + (role==="out"?"out":"in");
  var div = document.createElement("div");
  div.className = "msg tip";
  div.innerHTML = '<div>🧧 <b>红包</b> · '+esc(note)+'</div>'
    + '<div class="tip-amt">'+amount+' '+esc(currency)+'</div>'
    + (claimed ? '<div style="font-size:11px;color:var(--grn)">已领取</div>'
      : '<button class="tip-btn">领取红包</button>')
    + '<div class="time">'+ts2time(Date.now()/1000)+'</div>';
  if(!claimed){
    div.querySelector(".tip-btn").addEventListener("click", function(){
      div.querySelector(".tip-btn").replaceWith(Object.assign(document.createElement("div"),{className:"",style:"font-size:11px;color:var(--grn)",textContent:"已领取"}));
    });
  }
  wrap.appendChild(div);
  list.appendChild(wrap);
  list.scrollTop = list.scrollHeight;
}

function send(){
  var inp = $("chatIn");
  var text = inp.value.trim();
  if(!text) return;
  addMsg("out","",text);
  inp.value = "";
  if(currentChat.type==="support"){
    var typing = document.createElement("div");
    typing.className="typing"; typing.textContent="正在输入…";
    $("msgList").appendChild(typing);
    fetch(API+"/api/gbtwallet/social/support",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({from_uid:uid,to_uid:"SUPPORT",text:text,chat_type:"support"})})
      .then(function(r){return r.json();}).then(function(d){
        typing.remove();
        if(d.ok && d.ai){ addMsg("in","GBT 平台客服",d.ai.text); }
        else { addMsg("in","GBT 平台客服","客服暂时繁忙，请稍后再试。"); }
      }).catch(function(){ typing.remove(); addMsg("in","GBT 平台客服","（演示）AI 客服自动回复示例。"); });
  } else if(currentChat.type==="group"){
    setTimeout(function(){ addMsg("in","Bob",text==="看涨"?"+1 看涨":"收到 👍"); },400);
  } else {
    setTimeout(function(){ addMsg("in",currentChat.name,"（演示）已收到。"); },400);
  }
}

/* ===== 表情面板 ===== */
function renderEmojiTabs(){
  var html = "";
  Object.keys(EMOJI).forEach(function(k){
    var TAB_NAMES = {cute:"呆萌", business:"商务", gbt:"GBT"};
    html += '<button class="tab'+(k===currentTab?" active":"")+'" data-tab="'+k+'">'+(TAB_NAMES[k]||k)+'</button>';
  });
  $("emojiTabs").innerHTML = html;
  $("emojiTabs").querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){ currentTab=t.dataset.tab; renderEmojiTabs(); renderEmojiGrid(); });
  });
}
function renderEmojiGrid(){
  var html = "";
  EMOJI[currentTab].forEach(function(e){
    html += '<span data-emoji="'+e+'">'+e+'</span>';
  });
  $("emojiGrid").innerHTML = html;
  $("emojiGrid").querySelectorAll("span").forEach(function(s){
    s.addEventListener("click", function(){
      $("chatIn").value += s.dataset.emoji;
      $("chatIn").focus();
    });
  });
}
$("emojiBtn").addEventListener("click", function(){
  var p = $("emojiPanel");
  p.classList.toggle("open");
  if(p.classList.contains("open")){ renderEmojiTabs(); renderEmojiGrid(); }
});
$("attachBtn").addEventListener("click", function(){
  // iMe 风格: 附件菜单(红包/转账/文件)
  var list = $("msgList");
  addTipMsg("in", 5, "USDT", "请你喝咖啡", false);
});

$("sendBtn").addEventListener("click", send);
$("chatIn").addEventListener("keydown", function(e){
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});

renderAll();
openChat(dms[0]);
})();

    if(el.classList.contains('sect')){ el.style.display = q ? 'none' : ''; return; }
