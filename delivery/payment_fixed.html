        .countdown {

        .order-item {

        .order-info { display: flex; flex-direction: column; gap: 0.25rem; }
        .order-id { font-size: 0.8rem; color: var(--muted); }
        .order-amount { font-size: 1rem; font-weight: 600; color: var(--text); }
        .order-time { font-size: 0.75rem; color: var(--muted); }
        .order-status-badge {

        .order-status-badge.pending { background: rgba(210, 153, 34, 0.1); color: var(--warning); }

    <script>
        let selectedAmount = 50;
        let selectedMethod = 'crypto';
        let currentOrder = null;
        let countdownTimer = null;
        
        function selectAmount(amount) {
            selectedAmount = amount;
            document.getElementById('customAmount').value = '';
            document.querySelectorAll('.amount-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.amount) === amount);
            });
        }
        
        function selectMethod(method) {
            selectedMethod = method;
            document.querySelectorAll('.method-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.method === method);
            });
        }
        
        async function createOrder() {
            const customAmount = document.getElementById('customAmount').value;
            if (customAmount) selectedAmount = parseFloat(customAmount);
            
            if (!selectedAmount || selectedAmount < 1) {
                alert('请选择或输入充值金额');
                return;
            }
            
            const btn = document.querySelector('.submit-btn');
            btn.disabled = true;
            btn.textContent = '鍒涘缓涓?..';
            
            try {
                const response = await fetch('/api/payment/create?amount=' + encodeURIComponent(selectedAmount) + '&currency=USD', {
                    method: 'POST'
                });
                const order = await response.json();
                if (order.ok) {
                    currentOrder = order.data;
                    showOrderStatus(order.data);
                }
            } catch (error) {
                currentOrder = {
                    id: 'demo_' + Date.now(),
                    amount: selectedAmount,
                    method: selectedMethod,
                    status: 'pending',
                    address: 'TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t',
                    expiresAt: Date.now() + 15 * 60 * 1000
                };
                showOrderStatus(currentOrder);
            } finally {
                btn.disabled = false;
                btn.textContent = '鍒涘缓璁㈠崟';
            }
        }
        
        function showOrderStatus(order) {
            document.getElementById('depositCard').style.display = 'none';
            document.getElementById('orderCard').style.display = 'block';
            document.getElementById('statusText').textContent = '绛夊緟鏀粯';
document.getElementById('statusDesc').textContent = '请完成下方地址的转账';
            
            if (order.address) {
                document.getElementById('paymentAddress').style.display = 'block';
                document.getElementById('addressText').textContent = order.address;
            }
            
            startCountdown(order.expiresAt || (Date.now() + 15 * 60 * 1000));
            loadOrders();
        }
        
        function startCountdown(expiresAt) {
            if (countdownTimer) clearInterval(countdownTimer);
            function update() {
                const remaining = expiresAt - Date.now();
                if (remaining <= 0) {
                    clearInterval(countdownTimer);
document.getElementById('countdown').textContent = '已过期';
                    return;
                }
                const minutes = Math.floor(remaining / 60000);
                const seconds = Math.floor((remaining % 60000) / 1000);
                document.getElementById('countdown').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }
            update();
            countdownTimer = setInterval(update, 1000);
        }
        
        function copyAddress() {
            const address = document.getElementById('addressText').textContent;
            navigator.clipboard.writeText(address).then(() => {
                const btn = document.querySelector('.copy-btn');
btn.textContent = '已复制';
                setTimeout(() => btn.textContent = '澶嶅埗', 2000);
            });
        }
        
        async function refreshOrder() {
            if (!currentOrder?.id) return;
            try {
                const response = await fetch(`/api/payment/${currentOrder.id}`);
                const data = await response.json();
                if (data.data && data.data.status === 'paid') {
                    document.getElementById('statusIcon').className = 'status-icon success';
                    document.getElementById('statusText').textContent = '鏀粯鎴愬姛';
                    document.getElementById('statusDesc').textContent = '您的充值已完成';
                    if (countdownTimer) clearInterval(countdownTimer);
                    setTimeout(() => goToWallet(), 2000);
                }
            } catch (error) {
            }
        }
        
        function goToWallet() { window.location.href = '/ui/wallet_v2.html'; }
        
        async function loadOrders() {
            try {
                const response = await fetch('/api/payment/list?limit=5');
                const data = await response.json();
                if (data && (data.data || data.total !== undefined)) renderOrders(data.data);
            } catch (error) {
                renderOrders(getDemoOrders());
            }
        }
        
        function renderOrders(orders) {
            const container = document.getElementById('orderList');
            if (orders.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--muted); padding: 1rem;">鏆傛棤璁㈠崟璁板綍</p>';
                return;
            }
            container.innerHTML = orders.map(order => `
                <div class="order-item">
                    <div class="order-info">
                        <span class="order-id">#${order.id.slice(-8)}</span>
                        <span class="order-amount">$${order.amount} USD</span>
                        <span class="order-time">${new Date(order.created).toLocaleString()}</span>
                    </div>
                    <span class="order-status-badge ${order.status}">
                        ${order.status === 'pending' ? '等待支付' : order.status === 'success' ? '已完成' : '已过期'}
                    </span>
                </div>
            `).join('');
        }
        
        function getDemoOrders() {
            return [
                { id: 'ord_001', amount: 50, status: 'success', created: Date.now() - 3600000 },
                { id: 'ord_002', amount: 100, status: 'pending', created: Date.now() - 1800000 },
                { id: 'ord_003', amount: 200, status: 'expired', created: Date.now() - 7200000 }
            ];
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            loadOrders();
            document.getElementById('customAmount').addEventListener('input', (e) => {
                const value = e.target.value;
                if (value) {
                    selectedAmount = parseFloat(value);
                    document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active'));
                }
            });
        });
    </script>
