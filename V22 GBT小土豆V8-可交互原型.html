<!-- design-read: 对话优先 + 七块真面板。大脑执行层为精细可视化，全部读数来自真实调用（brain_health/route/execute/verify/unify） -->
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root,[data-theme="dark"]{
    --void:#04070f; --panel:#08111f; --panel-2:#0c1a2e; --panel-3:#102339;
    --line:rgba(88,196,255,0.14); --line-hot:rgba(88,196,255,0.34);
    --neon:#2ad4f0; --neon-2:#6ef2ff; --neon-dim:rgba(42,212,240,0.10);
    --ink:#dff2fb; --ink-2:rgba(223,242,251,0.74); --ink-3:rgba(223,242,251,0.54);
    --green:#3ddc97; --amber:#f5b544; --rose:#ff7a7a;
    --grid:rgba(88,196,255,0.05); --scrim:rgba(2,5,11,0.72);
    --glow:0 0 16px rgba(42,212,240,0.30); --btn-ink:#04121a;
  }
  [data-theme="light"]{
    --void:#f6f7f8; --panel:#ffffff; --panel-2:#f1f3f5; --panel-3:#e7ebee;
    --line:rgba(16,24,32,0.10); --line-hot:rgba(16,24,32,0.22);
    --neon:#0a7d94; --neon-2:#0a6f85; --neon-dim:rgba(10,125,148,0.08);
    --ink:#141a20; --ink-2:rgba(20,26,32,0.72); --ink-3:rgba(20,26,32,0.62);
    --green:#0f6b41; --amber:#8a5a00; --rose:#a3241c;
    --grid:rgba(16,24,32,0.04); --scrim:rgba(20,26,32,0.42);
    --glow:0 1px 3px rgba(16,24,32,0.10); --btn-ink:#ffffff;
  }
  :root{
    --r-sm:6px; --r-md:10px; --r-lg:14px;
    --mono:"SF Mono","JetBrains Mono","Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
    --sans:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --t:160ms cubic-bezier(0.16,1,0.3,1);
  }
  html,body{height:100%}
  body{background:var(--void);color:var(--ink);font-family:var(--sans);font-size:13.5px;overflow:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:46px 46px}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--neon);outline-offset:2px;border-radius:4px}
  ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line-hot);border-radius:3px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh}

  .top{flex:none;display:flex;align-items:center;gap:12px;height:52px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  .logo{flex:none;width:34px;height:34px;display:grid;place-items:center}
  .logo img{width:34px;height:34px;object-fit:contain;display:block;filter:drop-shadow(0 0 8px rgba(42,212,240,.45))}
  .brand b{display:block;font-size:14px;font-weight:600}
  .brand span{display:block;font-size:10px;color:var(--ink-3);letter-spacing:.06em}
  .spacer{flex:1}
  .iconbtn{width:30px;height:30px;border:1px solid var(--line);border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-2);transition:border-color var(--t),color var(--t)}
  .iconbtn:hover{border-color:var(--line-hot);color:var(--ink)}
  .godbtn{display:flex;align-items:center;gap:8px;height:32px;padding:0 13px;border-radius:100px;border:1px solid var(--line-hot);background:var(--neon-dim);color:var(--neon-2);font-size:12.5px;font-weight:600;box-shadow:var(--glow);transition:transform var(--t)}
  .godbtn:hover{transform:translateY(-1px)}
  .clock{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-align:right;white-space:nowrap}
  .clock small{display:block;font-size:9.5px;color:var(--ink-3)}
  .main{flex:1;display:grid;grid-template-columns:212px 262px minmax(0,1fr);min-height:0}
  .nav{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:10px 8px 16px}
  .nav-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink-3);padding:6px 8px;text-transform:uppercase}
  .navitem{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border-radius:var(--r-sm);font-size:12.5px;color:var(--ink-2);text-align:left;transition:background var(--t),color var(--t)}
  .navitem:hover{background:var(--panel-2);color:var(--ink)}
  .navitem[aria-current="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 2px 0 0 var(--neon)}
  .navitem svg{flex:none;width:15px;height:15px;opacity:.85}
  .navitem .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
  .navitem .star{color:var(--neon-2);font-size:9.5px;font-family:var(--mono)}
  .nav-foot{margin-top:14px;padding:10px 9px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-3);line-height:1.7}
  .nav-foot b{display:block;color:var(--ink-2);font-size:11.5px}

  .sessions{border-right:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column;min-height:0}
  .sess-head{flex:none;padding:10px;border-bottom:1px solid var(--line)}
  .newchat{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--ink)}
  .newchat:hover{border-color:var(--line-hot)}
  .sess-list{flex:1;overflow-y:auto;padding:8px}
  .sess-group{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;padding:9px 8px 5px}
  .sess{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:var(--r-sm);border-left:2px solid transparent}
  .sess:hover{background:var(--panel)}
  .sess[aria-current="true"]{background:var(--panel);border-left-color:var(--neon)}
  .sess .t{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sess .s{display:flex;gap:8px;margin-top:3px;font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
  .sess .err{color:var(--rose)}
  .sess .bad{color:var(--amber)}

  .chat{display:flex;flex-direction:column;min-height:0;background:var(--void)}
  .chat-top{flex:none;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
  .chat-top .tag{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:100px;border:1px solid var(--line);color:var(--ink-3)}
  .chat-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
  .panelbody{flex:1;overflow-y:auto;padding:14px}
  .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
  .hero .orb{width:64px;height:64px;display:grid;place-items:center}
  .hero .orb img{width:64px;height:64px;object-fit:contain;display:block;filter:drop-shadow(0 0 16px rgba(42,212,240,.52))}
  .hero h1{font-size:23px;font-weight:600;letter-spacing:-0.02em;max-width:22ch}
  .hero p{font-size:12.5px;color:var(--ink-3);max-width:46ch;line-height:1.7}
  .quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:540px}
  .qchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:100px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:11px;color:var(--ink-2)}
  .qchip:hover{border-color:var(--line-hot);color:var(--ink)}
  .msg{display:flex;gap:10px;max-width:760px}
  .msg .av{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;border:1px solid var(--line);background:var(--panel);color:var(--ink-3)}
  .msg .bub{border:1px solid var(--line);background:var(--panel);border-radius:var(--r-md);padding:9px 12px;font-size:13px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .bub{background:var(--neon-dim);border-color:var(--line-hot);color:var(--ink)}
  .msg .meta{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-top:5px}

  .composer{flex:none;padding:10px 20px 16px}
  .comp-inner{max-width:760px;margin:0 auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);overflow:hidden}
  .comp-inner:focus-within{border-color:var(--line-hot)}
  .comp-chips{display:flex;gap:6px;padding:9px 10px 0;flex-wrap:wrap}
  .cchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:100px;border:1px solid var(--line);background:var(--panel-2);font-size:11px;color:var(--ink-2);white-space:nowrap}
  .cchip svg{width:12px;height:12px}
  .comp-inner textarea{width:100%;min-height:52px;max-height:150px;resize:none;border:none;background:none;outline:none;padding:10px 12px;font-size:13.5px;line-height:1.6}
  .comp-inner textarea::placeholder{color:var(--ink-3)}
  .comp-bar{display:flex;align-items:center;gap:8px;padding:0 10px 10px}
  .pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:100px;border:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
  .pill.warn{color:var(--amber);border-color:rgba(245,181,68,.35);background:rgba(245,181,68,.08)}
  .send{width:30px;height:30px;border-radius:50%;background:var(--neon);color:var(--btn-ink);display:grid;place-items:center}
  .send[disabled]{opacity:.4;cursor:not-allowed}
  .spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(4,18,26,.25);border-top-color:var(--btn-ink);animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* 通用卡片 */
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .card{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);overflow:hidden}
  .card-h{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
  .card-h b{color:var(--neon-2);font-weight:600}
  .card-h .r{margin-left:auto;letter-spacing:.06em}
  .card-b{padding:11px}
  .statline{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);padding:4px 0}
  .statline .led{width:6px;height:6px;border-radius:50%;flex:none}
  .statline .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink)}
  .led.g{background:var(--green)} .led.a{background:var(--amber)} .led.r{background:var(--rose)} .led.d{background:var(--ink-3)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:11.5px}
  .kv dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
  .kv dd{color:var(--ink);word-break:break-word}
  .mono{font-family:var(--mono)}
  .dim{color:var(--ink-3)}
  .track{height:4px;border-radius:2px;background:var(--panel-3);overflow:hidden}
  .track i{display:block;height:100%;background:linear-gradient(90deg,var(--neon),var(--neon-2))}

  /* 大脑执行层 */
  .chainbox{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);overflow:hidden;margin-bottom:10px}
  .chainbox svg{display:block;width:100%;height:auto}
  .flow{stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-28}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .stagecard{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);overflow:hidden}
  .stagecard.on{border-color:var(--line-hot);box-shadow:var(--glow)}
  .stagecard .sh{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink)}

<style id="cine">
/* ══════════════════════════════════════════════════════════════════════════
   V21 · 影视氛围层（cinematic atmosphere）
   设计读法：dark-tech capability console for its single owner，
             cinematic / deep-space instrument-panel，原生 CSS 分层 + 一套克制的运动系统。
   档位：DESIGN_VARIANCE 4（沿用既有）· MOTION_INTENSITY 5（原 2，+3）· VISUAL_DENSITY 8（沿用）
   ══════════════════════════════════════════════════════════════════════════
   z-index 刻度（全项目唯一口径，不再随手写数字）：
     0     氛围层（极光 / 暗角）：固定、pointer-events:none
     1     内容层（.app / .canvas-viewport）
     10    卡片悬浮
     880+  既有抽屉与模态（不改）
     9000  胶片颗粒：最上层、pointer-events:none
   运动规范：
     · 只动 transform / opacity，绝不动 top/left/width/height
     · 无限循环与入场编排在 prefers-reduced-motion 下一律静止
     · 颗粒只挂在固定不滚动的伪元素上（不在滚动容器上做滤镜）
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 1. 极光：两团超大径向渐变，只靠 transform 缓慢漂移（无 blur 滤镜，径向衰减自带柔化）── */
.cine-atmo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cine-atmo i{position:absolute;display:block;border-radius:50%;will-change:transform}
.cine-a{width:86vw;height:86vw;left:-22vw;top:-30vw;
  background:radial-gradient(circle,rgba(42,212,240,.20) 0%,rgba(42,212,240,.075) 34%,rgba(42,212,240,0) 68%);
  animation:cineDrift1 68s ease-in-out infinite}
.cine-b{width:72vw;height:72vw;right:-18vw;bottom:-26vw;
  background:radial-gradient(circle,rgba(110,242,255,.15) 0%,rgba(110,242,255,.05) 36%,rgba(110,242,255,0) 70%);
  animation:cineDrift2 88s ease-in-out infinite}
.cine-c{width:52vw;height:52vw;left:44vw;top:34vh;
  background:radial-gradient(circle,rgba(58,120,220,.13) 0%,rgba(58,120,220,0) 66%);
  animation:cineDrift3 104s ease-in-out infinite}
@keyframes cineDrift1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,5vh,0) scale(1.14)}}
@keyframes cineDrift2{0%,100%{transform:translate3d(0,0,0) scale(1.1)}50%{transform:translate3d(-5vw,-4vh,0) scale(1)}}
@keyframes cineDrift3{0%,100%{transform:translate3d(0,0,0) scale(.94)}50%{transform:translate3d(-7vw,6vh,0) scale(1.08)}}

/* ── 2. 暗角：把注意力压回画面中心 ── */
.cine-v{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(126% 92% at 50% 40%,transparent 40%,rgba(0,0,0,.42) 78%,rgba(0,0,0,.62) 100%)}

/* ── 3. 胶片颗粒：固定伪元素、不挡点击、不参与滚动重绘 ── */
body::after{content:'';position:fixed;inset:0;z-index:9000;pointer-events:none;opacity:.05;
  background-repeat:repeat;background-size:170px 170px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='170' height='170' filter='url(%23n)'/></svg>")}

/* ── 4. 面板入场编排：一次有节奏的到位，而不是散落的微动效 ── */
@keyframes cineRise{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:none}}
#chatBody>*,#godBody>*{animation:cineRise .54s cubic-bezier(.16,1,.3,1) both;
  animation-delay:calc(min(var(--ci,0),11) * 42ms)}

/* ── 5. 卡片：顶部来光 + 着色阴影（不是纯黑投影）+ 悬浮抬升 ── */
.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 34px -22px rgba(0,0,0,.9);
  transition:transform var(--t),border-color var(--t),box-shadow var(--t)}
.card:hover{transform:translate3d(0,-2px,0);border-color:var(--line-hot);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.085),0 22px 48px -24px rgba(42,212,240,.34)}
.card-h{background:linear-gradient(180deg,rgba(88,196,255,.062),rgba(88,196,255,0))}

/* ── 6. 读数发光：让数字像仪表灯，而不是印刷体 ── */
[style*="color:var(--neon-2)"]{text-shadow:0 0 15px rgba(42,212,240,.32)}
.statline .n{text-shadow:0 0 12px rgba(42,212,240,.22)}

/* ── 7. 进度条：轨道内凹 + 填充发光 ── */
.track{box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
.track i{box-shadow:0 0 12px rgba(42,212,240,.55)}
.track i.warn{box-shadow:0 0 12px rgba(245,181,68,.5)}
.track i.rose{box-shadow:0 0 12px rgba(255,122,122,.5)}

/* ── 8. 导航：当前项一道左侧光条 + 内侧溢光 ── */
.navitem[aria-current="true"]{box-shadow:inset 2px 0 0 var(--neon),inset 0 0 26px rgba(42,212,240,.10)}
.navitem{transition:background var(--t),color var(--t),box-shadow var(--t)}

/* ── 9. 顶栏 / 面板头：下缘一层自上而下的微光 ── */
.top,.chat-top{background-image:linear-gradient(180deg,rgba(88,196,255,.055),rgba(88,196,255,0))}

/* ── 10. 按钮触感：按下时下沉 1px（§4.5 tactile feedback）── */
.iconbtn:active,.godbtn:active,.pill:active,.qchip:active,.navitem:active,.send:active,.newchat:active{transform:translate3d(0,1px,0)}
.iconbtn,.godbtn,.pill,.qchip,.send,.newchat{transition:transform var(--t),border-color var(--t),color var(--t),background var(--t)}

/* ── 11. 上帝视角：更深的纵深，像一层浮在数据之上的观察窗 ── */
.god-panel{box-shadow:0 0 0 1px rgba(42,212,240,.10),0 40px 120px -40px rgba(42,212,240,.30),
  0 0 90px rgba(42,212,240,.12)}

/* ── 12. 画布页：只对「页」做纵深，不对卡片/便签做（用 :has 限定）── */
.canvas-el:has(> .design-page){box-shadow:0 28px 74px -40px rgba(0,0,0,.95),0 0 0 1px rgba(88,196,255,.05);
  transition:transform var(--t),box-shadow var(--t)}
.canvas-el:has(> .design-page):hover{transform:translate3d(0,-3px,0);
  box-shadow:0 38px 96px -42px rgba(0,0,0,.95),0 0 0 1px rgba(42,212,240,.22),0 0 54px -12px rgba(42,212,240,.20)}
.canvas-el.dragging,.canvas-el.dragging:has(> .design-page){transform:none}
.page-label{text-shadow:0 0 14px rgba(42,212,240,.30);letter-spacing:.06em}
.page-label .label-num{text-shadow:0 0 12px rgba(42,212,240,.55)}

/* ── 13. 降低动态：无限循环静止、入场取消、悬浮不位移 ── */
@media (prefers-reduced-motion:reduce){
  .cine-atmo i{animation:none!important}
  #chatBody>*,#godBody>*{animation:none!important;opacity:1!important;transform:none!important}
  .card:hover,.canvas-el:has(> .design-page):hover{transform:none}
  .iconbtn:active,.godbtn:active,.pill:active,.qchip:active,.navitem:active,.send:active,.newchat:active{transform:none}
}
</style>
<style id="refine">
/* ── V21 · 真渲染揪出的布局 bug（影响所有面板）──
   .chat-body 是 display:flex;flex-direction:column;overflow-y:auto。
   列向 flex 的子项默认 flex-shrink:1 —— 内容比容器高时**不是滚动，而是被压缩**，
   再被 .card{overflow:hidden} 把压缩后的溢出裁掉 ⇒ 内容被静默切掉。
   实测：某卡片渲染高 248 / 内容高 268 以上，容器 scrollHeight===clientHeight（根本不滚）。
   修：面板直接子项一律不许收缩，容器这才真的滚动。 */
.chat-body>*,.god-body>*{flex:0 0 auto}
.god-body{overflow-y:auto}

/* ══════════════════════════════════════════════════════════════════════════
   V21 · 专业化打磨层（typography · rhythm · data craft）
   按 taste-skill §11.D 现代化杠杆：V15 做的是第 4 项（运动层），
   本层做第 1 项（字体排印，单位风险收益最高）与第 2 项（间距与节奏）。
   审计依据（改动前实测）：
     字重 1 档（600）· 行高 2 档 · 字距 7 档无规律
     gap 11 种值（4/5/6/7/8/9/10/11/12/14/15）· margin 7 种值
     font-variant-numeric 0 处 · tabular-nums 0 处 · ::selection 未定义
   原则：
     · 只动排版、间距与表面层级，不动结构、文案、数据、逻辑
     · 明暗两套主题都要成立 —— 一律走 token，不写死颜色
     · 不引入外部字体（交付件要单文件离线可开），靠系统栈的精修与字距字重建立层级
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 1. 刻度：字重 / 字距 / 行高 / 间距（2px 密排基 + 4px 骨架基）── */
:root{
  /* 字重刻度：原来只有 1 档，层级全靠字号撑 */
  --w-reg:400; --w-med:500; --w-sem:600; --w-bold:700;
  /* 字距刻度：把原来 7 个随手值收成 4 档 */
  --ls-display:-.022em;   /* 大读数、大标题 */
  --ls-tight:-.006em;     /* 正文密排 */
  --ls-caps:.08em;        /* 小号大写标签 */
  --ls-label:.14em;       /* 卡片头标签 */
  /* 行高刻度：原来只有 1.6 / 1.7 */
  --lh-display:1.05;      /* 大读数 */
  --lh-tight:1.38;        /* 单行标签、行内数据 */
  --lh-body:1.72;         /* 段落 */
  /* 间距刻度：2px 为最小步进（密排数据），4px 为骨架步进 */
  --sp-1:4px; --sp-2:6px; --sp-3:8px; --sp-4:10px;
  --sp-5:12px; --sp-6:16px; --sp-7:20px; --sp-8:24px; --sp-9:32px;
}

/* ── 2. 字体栈精修：光学尺寸 + 中文标点换行 + 合成控制 ── */
html{font-optical-sizing:auto;-webkit-text-size-adjust:100%}
body{
  font-weight:var(--w-reg);
  line-break:strict;            /* 中文标点不置行首 */
  text-rendering:optimizeLegibility;
  font-synthesis:none;          /* 该字重没有就不许伪加粗 */
}
/* 数字与代码：统一等宽数字，表格列才会真正对齐 */
.mono,[style*="var(--mono)"],.statline .n,.routebar code,.kv b{
  font-variant-numeric:tabular-nums lining-nums;
  font-feature-settings:"tnum" 1,"lnum" 1,"zero" 1;
}

/* ── 3. 排印层级：用字重 + 字距建立层次，而不是只放大字号 ── */
.card-h{
  font-weight:var(--w-med);letter-spacing:var(--ls-label);line-height:var(--lh-tight);
}
.card-h b{
  font-weight:var(--w-sem);letter-spacing:var(--ls-caps);
}
.card-h .r{font-weight:var(--w-reg);letter-spacing:var(--ls-caps)}
/* 大读数：收紧字距 + 加重 + 行高压紧，像仪表读数而不是正文 */
[style*="font-size:22px"],[style*="font-size:23px"],[style*="font-size:24px"],
[style*="font-size:26px"],[style*="font-size:30px"],[style*="font-size:19px"],
[style*="font-size:18px"],[style*="font-size:17px"]{
  font-weight:var(--w-bold);letter-spacing:var(--ls-display);line-height:var(--lh-display);
}
.statline .n{font-weight:var(--w-med);letter-spacing:var(--ls-tight);line-height:var(--lh-tight)}
.statline{line-height:var(--lh-tight)}
.routebar{line-height:var(--lh-tight)}
.kv{line-height:var(--lh-tight)}
p{line-height:var(--lh-body)}
/* 中文标题允许平衡断行；正文用 pretty */
.hero h1,.chat-top b{text-wrap:balance}
.hero p,.card-b>p{text-wrap:pretty}

/* ── 4. 间距与节奏：把散落值收到 2px 刻度上（chrome 一律走 token）── */
.chat-body{padding:var(--sp-8);gap:var(--sp-6)}
.grid2,.grid3{gap:var(--sp-5)}
.card-h{padding:var(--sp-3) var(--sp-5)}
.card-b{padding:var(--sp-5)}
.kv{gap:var(--sp-2) var(--sp-5)}
.routebar{gap:var(--sp-3);padding:var(--sp-1) 0}
.grow1,.grow2{gap:var(--sp-5)}

/* 数据行：让高亮能向外溢一点，文字起点不变（负 margin 由内边距补回）── */
.statline{
  gap:var(--sp-4);padding:var(--sp-1) var(--sp-3);margin:0 calc(var(--sp-3) * -1);
  border-radius:var(--r-sm);
  transition:background var(--t);
}
.statline:hover{background:var(--neon-dim)}
.routebar{
  padding-left:var(--sp-3);padding-right:var(--sp-3);
  margin:0 calc(var(--sp-3) * -1);border-radius:var(--r-sm);
  transition:background var(--t);
}
.routebar:hover{background:var(--neon-dim)}
/* 行内分隔线只留最淡的一道，避免密集虚线把版面切碎 */
.routebar{border-bottom-color:var(--line)}

/* ── 5. 表面层级：主表面抬起、内嵌表面下沉（§4.4 卡片只在表达层级时用）── */
.card:not(.card .card){
  background:var(--panel);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 34px -22px rgba(0,0,0,.9);
}
.card .card{
  background:var(--panel-2);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.32);
  border-color:var(--line);
}
/* 明色主题下下沉阴影要反过来，否则会脏 */
[data-theme="light"] .card .card{box-shadow:inset 0 1px 2px rgba(16,24,32,.06)}
[data-theme="light"] .card:not(.card .card){
  box-shadow:0 1px 2px rgba(16,24,32,.06),0 8px 24px -18px rgba(16,24,32,.28);
}

/* ── 6. 细节工艺 ── */
::selection{background:rgba(42,212,240,.30);color:var(--ink)}
[data-theme="light"] ::selection{background:rgba(10,125,148,.22);color:var(--ink)}
/* 焦点环：跟随圆角，不再是一个方框套在圆角元素上 */
:focus-visible{outline:2px solid var(--neon);outline-offset:2px;border-radius:var(--r-sm)}
/* 徽标/胶囊里的数字也用等宽数字，避免宽度跳动 */
.pill,.qchip,.badge,.cap{font-variant-numeric:tabular-nums}
/* 长 token（路径、指纹、sha）在窄列里允许断行，避免撑破网格 */
.mono{overflow-wrap:anywhere;word-break:normal}
.statline .n,.routebar code{overflow-wrap:normal}

/* ── 7. 画布页：同样把排印层级与数字工艺带过去 ── */
.page-label{font-weight:var(--w-med);letter-spacing:var(--ls-caps)}
.page-label .label-num{font-variant-numeric:tabular-nums;font-weight:var(--w-sem)}
.ds-card .ds-title,.canvas-note .note-tag{letter-spacing:var(--ls-label)}
.ds-card,.canvas-note,.canvas-title,.canvas-text{line-break:strict}
</style>
</head>

  function drawDag(wf) {
    var el = $('dag'); if (!el) return;
    var nodes = (wf.nodes || []);
    if (!nodes.length) { el.innerHTML = '<div class="empty"><h4>该工作流没有节点</h4></div>'; return; }
    var byId = {};
    nodes.forEach(function (n) { byId[n.id] = n; });
    var depth = {};
    function d(id) {
      if (depth[id] != null) return depth[id];
      var n = byId[id]; if (!n) return 0;
      var deps = n.depends_on || [];
      depth[id] = deps.length ? Math.max.apply(null, deps.map(d)) + 1 : 0;
      return depth[id];
    }
    nodes.forEach(function (n) { d(n.id); });
    var layers = {};
    nodes.forEach(function (n) { (layers[depth[n.id]] = layers[depth[n.id]] || []).push(n); });
    var CW = 118, CH = 30, GX = 10, GY = 22, PAD = 14;
    var maxW = Math.max.apply(null, Object.keys(layers).map(function (k) { return layers[k].length; }));
    var maxD = Math.max.apply(null, Object.keys(layers).map(Number));
    var W = PAD * 2 + maxW * CW + (maxW - 1) * GX;
    var H = PAD * 2 + (maxD + 1) * (CH + GY);
    var pos = {}, o = [];
    Object.keys(layers).forEach(function (k) {
      var L = layers[k], i;
      var rowW = L.length * CW + (L.length - 1) * GX;
      var x0 = (W - rowW) / 2, y = PAD + Number(k) * (CH + GY);
      L.forEach(function (n, i2) {
        pos[n.id] = { x: x0 + i2 * (CW + GX), y: y };
      });
    });
    nodes.forEach(function (n) {
      (n.depends_on || []).forEach(function (dp) {
        var a = pos[dp], b = pos[n.id]; if (!a || !b) return;
        var x1 = a.x + CW / 2, y1 = a.y + CH, x2 = b.x + CW / 2, y2 = b.y;
        var my = (y1 + y2) / 2;
        o.push('<path d="M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + my + ',' + x2 + ' ' + my + ',' + x2 + ' ' + y2 +
          '" fill="none" stroke="var(--line-hot)" stroke-width="1.2" class="flow"/>');
      });
    });
    nodes.forEach(function (n) {
      var p = pos[n.id];
      o.push('<g><rect x="' + p.x + '" y="' + p.y + '" width="' + CW + '" height="' + CH + '" rx="5" fill="var(--panel-2)" stroke="var(--line-hot)"/>' +
        '<text x="' + (p.x + 8) + '" y="' + (p.y + 13) + '" fill="var(--ink)" font-family="var(--mono)" font-size="9.5">' + esc(n.id) + '</text>' +
        '<text x="' + (p.x + 8) + '" y="' + (p.y + 24) + '" fill="var(--ink-3)" font-family="var(--mono)" font-size="8.5">' + esc(n.kind) + '</text></g>');
    });
    el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:' + W + 'px;max-width:none;height:auto;display:block" role="img" ' +
      'aria-label="工作流 ' + esc(wf.name) + ' 的依赖图，共 ' + nodes.length + ' 个节点">' + o.join('') + '</svg>' +
      '<p style="font-size:10px;color:var(--ink-3);margin-top:7px">层 = 依赖深度；同层节点并行执行（wf_run 分层并行）。节点下方等宽字为真实 kind。</p>';
  }

  function kvRows(pairs) {
    return pairs.map(function (r) {
      return '<div class="statline"><span class="led ' + (r[2] || 'g') + '"></span>' + esc(r[0]) +
        '<span class="n mono" style="font-size:10.5px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        esc(r[1] == null ? '—' : String(r[1])) + '</span></div>';
    }).join('');
  }
  function bar(label, n, den, tone) {
    var p = den ? Math.round(100 * n / den) : 0;
    /* 钳位：分母若小于真实值，填充会渲成 >100% 并溢出卡片边界。
       这不是显示层的容错，而是提醒：**永远不要给 bar 编分母**。 */
    p = Math.max(0, Math.min(100, p));
    return '<div style="padding:4px 0"><div style="display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--ink-2)">' +
      '<span>' + esc(label) + '</span><span class="mono" style="margin-left:auto;color:var(--neon-2);font-size:10.5px">' +
      n + (den ? '/' + den : '') + '</span></div>' +
      '<span class="track" style="display:block;margin-top:5px"><i class="' + (tone || '') + '" style="width:' + p + '%"></i></span></div>';
  }

  /* ── 上帝视角 ── */
  /* ══════════════════════════════════════════════════════════════════
     宿主外壳层 · V21 新增 10 面板
     全部席位 id 来自本机 @deepseek-ai/* 包 lib/client.js 的真实注册，
     无一条编造。判据：该 slot 是否在本原型里真正渲染出来。
     ══════════════════════════════════════════════════════════════════ */
  var DSH = V21.dsh;

  function dshShort(n) {
    return String(n).replace(/^dsh-client-ui-/, '').replace(/^dsh-client-/, '').replace(/^dsh-/, '');
  }
  function dshDone(slot) {
    for (var i = 0; i < DSH.implemented.length; i++) {
      if (DSH.implemented[i].slot === slot) return DSH.implemented[i].how;
    }
    return null;
  }
  function dshOwners(slot) {
    var o = DSH.slot_owner[slot] || [];
    if (!o.length) return '无注册方';
    return o.slice(0, 3).map(dshShort).join(' + ') + (o.length > 3 ? ' 等 ' + o.length + ' 个' : '');
  }
  function dshSlotRows(keys, hideOwner) {
    if (!keys || !keys.length) {

    }

      var how = dshDone(s);
      return '<div class="statline"><span class="led ' + (how ? 'g' : (hideOwner ? 'd' : 'r')) + '"></span>' +
        '<span class="mono" style="font-size:10.5px;color:' + (how ? 'var(--ink)' : 'var(--ink-2)') + '">' + esc(s) + '</span>' +
        '<span class="n mono" style="font-size:9.5px;max-width:56%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:' +
        (how ? 'var(--neon-2)' : 'var(--ink-3)') + '">' +
        esc(how ? how : (hideOwner ? '未实现' : dshOwners(s))) + '</span></div>';
    }).join('');

  function dshFamCard(key, hideOwner) {
    var f = null, i;
    for (i = 0; i < DSH.families.length; i++) if (DSH.families[i].key === key) f = DSH.families[i];
    if (!f) return '';
    var done = f.slots.filter(function (s) { return !!dshDone(s); }).length;
    return '<div class="card"><div class="card-h"><b>' + esc(f.zh) + '</b><span class="r">' +
      f.slots.length + ' 席位 · 已实现 ' + done + '</span></div><div class="card-b">' +
      dshSlotRows(f.slots, hideOwner) + '</div></div>';
  }
  function dshPluginRows(names, note) {
    var byName = {};
    DSH.plugins.forEach(function (p) { byName[p.name] = p; });
    var found = names.filter(function (n) { return byName[n]; });
    if (!found.length) {
      return '<div class="statline" style="color:var(--ink-3)">本次扫描未在客户端清单里找到这些包。</div>';
    }
    return found.map(function (n) {
      var p = byName[n];
      return '<div style="padding:7px 0;border-bottom:1px solid var(--line)">' +
        '<div style="display:flex;align-items:baseline;gap:8px">' +
        '<span class="mono" style="font-size:11px;color:var(--ink)">' + esc(n) + '</span>' +
        '<span class="mono dim" style="font-size:9.5px;margin-left:auto">' + p.n_slots + ' 席位</span></div>' +
        '<p style="font-size:10px;color:var(--ink-3);margin:4px 0 5px;line-height:1.7">' + esc(p.desc || '（该包 README 无前置描述）') + '</p>' +

          return '<span class="cap ' + (dshDone(s) ? 'g' : '') + '"><i></i>' + esc(s) + '</span>';

    }).join('') + (note ? '<p style="font-size:10px;color:var(--ink-3);margin-top:8px">' + esc(note) + '</p>' : '');

    if (n == null) return '—';

    if (n >= 1024) return (n / 1024).toFixed(0) + ' KB';
    return n + ' B';

     前 13 版的「未进面板」清单是我手挑的 12 个目录 —— 手挑必漏。
     本版改成机器穷举：260,342 行自有代码里，连模块名都没进过交付件的有 131,283 行（50.4%）。
     本页补的是其中最要紧的：统一接口层、授权与安全策略、框架底座、omni 触手家族、部署层、

  var CORE = V21.core;
  var COV = V21.coverage;

  function covNum(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  function coreFileRows(items, limit) {
    if (!items || !items.length) {
      return '<div class="statline" style="color:var(--ink-3)">本组在本次审计里没有未覆盖文件。</div>';
    }
    var shown = items.slice(0, limit || 14);
    var h = shown.map(function (m) {
      return '<div style="padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start">' +
        '<span class="mono" style="font-size:9.5px;color:var(--neon-2);flex:none;width:52px;text-align:right">' +
        covNum(m.lines) + '</span>' +
        '<div style="min-width:0;flex:1">' +
        '<div class="mono" style="font-size:10.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        esc(m.f) + '</div>' +
        (m.doc ? '<p style="font-size:9.5px;color:var(--ink-3);margin:3px 0 0;line-height:1.7">' + esc(m.doc) + '</p>' : '') +
        '</div></div>';
    }).join('');
    if (items.length > shown.length) {
      var rest = items.slice(shown.length);
      h += '<p style="font-size:10px;color:var(--ink-3);margin-top:8px">… 另 ' + rest.length +
        ' 个文件 / ' + covNum(rest.reduce(function (a, x) { return a + x.lines; }, 0)) + ' 行</p>';
    }
    return h;
  }

  function panelCovAudit() {
    head('源码覆盖审计', { tag: 'coverage', meta: '机器穷举 · 非手挑' });
    var dirs = Object.keys(COV.by_dir).map(function (k) {

      return { k: k, n: v.n, lines: v.lines, cov: v.covered_lines,
               un: v.lines - v.covered_lines, uncov_n: v.uncov_n || 0 };
    }).filter(function (d) { return d.un > 0; })

  function treeHuman(bytes) {
    if (bytes == null) return '';
    var u = ['B', 'KB', 'MB', 'GB'], i = 0, v = bytes;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (i === 0 ? v : v.toFixed(1)) + ' ' + u[i];
  }
  function treePathHead(root) {
    var sep = root.indexOf('\\') >= 0 ? '\\' : '/';
    var parts = root.split(sep);
    var last = parts.pop();
    return '<span style="color:var(--ink-3)">' + esc(parts.join(sep) + sep) + '</span>' +
      '<span style="color:var(--ink)">' + esc(last) + '</span>';
  }
  function treeRow(e, depth, root) {
    var pad = 8 + depth * 15;
    var ico = e.kind === 'directory'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="12" height="12" style="color:var(--neon-2)" aria-hidden="true"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>'
      : e.kind === 'file'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="12" height="12" style="color:var(--ink-3)" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="12" height="12" style="color:var(--ink-3);opacity:.5" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>';
    var tail = e.kind === 'directory'
      ? '<span class="mono dim" style="font-size:9.5px">' + (e.count == null ? '—' : e.count + ' 项') + '</span>'
      : (e.kind === 'file' ? '<span class="mono dim" style="font-size:9.5px">' + treeHuman(e.bytes) + '</span>' : '<span class="mono dim" style="font-size:9.5px">other</span>');
    var clickable = e.kind !== 'other';
    var tag = clickable ? 'button' : 'div';
    var attrs = clickable
      ? ' data-tree="' + esc(e.name) + '" data-kind="' + esc(e.kind) + '"' + (e.kind === 'directory' ? ' aria-expanded="' + (!!e.entries) + '"' : '')
      : ' aria-disabled="true"';
    var out = '<' + tag + attrs + ' style="display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:3px 8px 3px ' + pad +
      'px;border-radius:3px;' + (clickable ? '' : 'opacity:.45;cursor:not-allowed;') + '">' +
      ico + '<span style="font-family:var(--mono);font-size:10.5px;color:' +
      (e.kind === 'other' ? 'var(--ink-3)' : 'var(--ink)') + ';flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
      esc(e.name) + '</span>' + tail + '</' + tag + '>';
    if (e.entries && e.entries.length) {
      out += e.entries.map(function (c) { return treeRow(c, depth + 1, root); }).join('');
      if (e.truncated) {
        out += '<div style="padding:3px 8px 3px ' + (pad + 15) + 'px;font-family:var(--mono);font-size:9.5px;color:var(--amber)">' +
          '已达单层上限 ' + (e.count || 0) + '，其余已丢弃（规格：maxEntries）</div>';
      }
    } else if (e.entries && !e.entries.length) {
      out += '<div style="padding:3px 8px 3px ' + (pad + 15) + 'px;font-family:var(--mono);font-size:9.5px;color:var(--ink-3)">此目录为空</div>';
    }
    if (e.errors && e.errors.length) {
      out += '<div style="padding:3px 8px 3px ' + (pad + 15) + 'px;font-family:var(--mono);font-size:9.5px;color:var(--rose)">' +
        e.errors.map(function (x) { return esc(x.code || 'error'); }).join(' · ') + '</div>';
    }
    return out;
  }
  function treeCard() {
    var TR = V21.tree || {}, T = TR.tree || {}, sp = TR.spec || {};
    var ent = T.entries || [];
    var dirs = ent.filter(function (e) { return e.kind === 'directory'; }).length;
    var files = ent.filter(function (e) { return e.kind === 'file'; }).length;
    var others = ent.filter(function (e) { return e.kind === 'other'; }).length;
    return '<div class="card" style="margin-bottom:11px"><div class="card-h"><b>项目树</b> / PROJECT TREE' +
      '<span class="r">' + esc(sp.source || '') + '</span></div>' +
      '<div class="card-b">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);margin-bottom:6px">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="13" height="13" style="color:var(--neon-2)" aria-hidden="true"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>' +
      '<span class="mono" style="font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
      treePathHead(String(T.path || '')) + '</span>' +
      '<span class="mono dim" style="font-size:9.5px">' + (T.count || 0) + ' 项 · 目录 ' + dirs + ' / 文件 ' + files +
      (others ? ' / 其他 ' + others : '') + '</span>' +
      '<button class="pill" id="treeReload" style="height:22px;font-size:10px">重新读取</button></div>' +
      '<div id="treeBody" style="max-height:290px;overflow:auto">' +
      ent.map(function (e) { return treeRow(e, 0, T.path); }).join('') +
      (T.truncated ? '<div style="padding:4px 8px;font-family:var(--mono);font-size:9.5px;color:var(--amber)">' +
        '根层已达上限 ' + (sp.limits ? sp.limits.maxEntries_root : '') + '（该目录共 ' + (T.count || 0) + ' 项），其余已丢弃并标记 truncated</div>' : '') +
      (ent.length ? '' : '<div style="padding:10px 8px;font-size:10.5px;color:var(--ink-3)">该会话没有工作目录 —— 规格要求只显示一行说明，而不是树。</div>') +
      '</div>' +
      '<p style="font-size:9.5px;color:var(--ink-3);margin-top:8px;line-height:1.8">' +
      '规格要点：' + esc(sp.order || '') + ' · dotfiles ' + esc(sp.dotfiles || '') + ' · ' + esc(sp.other_row || '') +
      '<br>已知限制：' + esc(sp.known_limits || '') + '</p>' +
      '</div></div>';
  }

  function drawNet() {
    var el = $('net'); if (!el) return;
    var W = el.clientWidth || 520, H = el.clientHeight || 320;
    var cx = W / 2, cy = H / 2 + 4, R = Math.min(W, H) * 0.36, n = DOMAINS.length, o = [];
    o.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + (R * 0.34) + '" fill="none" stroke="var(--line)"/>');
    o.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + (R * 0.68) + '" fill="none" stroke="var(--line)" stroke-dasharray="3 5"/>');
    o.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="var(--line)"/>');
    DOMAINS.forEach(function (d, i) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n;
      o.push('<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + Math.cos(a) * R).toFixed(1) + '" y2="' + (cy + Math.sin(a) * R).toFixed(1) + '" stroke="var(--line)"/>');
    });
    o.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + (R * 0.30) + '" fill="var(--panel-2)" stroke="var(--line-hot)"/>');
    o.push('<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" fill="var(--neon-2)" font-family="var(--mono)" font-size="19">GBT</text>');
    o.push('<text x="' + cx + '" y="' + (cy + 13) + '" text-anchor="middle" fill="var(--ink-3)" font-family="var(--mono)" font-size="9">' + M.executable + ' 项 · ' + M.domains + ' 域</text>');
    DOMAINS.forEach(function (d, i) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n;
      var x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
      var lx = cx + Math.cos(a) * (R + 17), ly = cy + Math.sin(a) * (R + 17) + 3.5;
      var anc = Math.cos(a) > 0.25 ? 'start' : (Math.cos(a) < -0.25 ? 'end' : 'middle');
      o.push('<g class="node" data-domain="' + esc(d.name) + '" tabindex="0" role="button" aria-label="' +
        esc((ALIAS[d.name] || d.name) + '，' + d.count + ' 项能力') + '">' +
        '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5" fill="var(--panel-2)" stroke="var(--neon)"/>' +
        '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anc + '" fill="var(--ink-2)" font-size="10.5">' + esc(ALIAS[d.name] || d.name) + '</text>' +
        '<text x="' + lx.toFixed(1) + '" y="' + (ly + 11).toFixed(1) + '" text-anchor="' + anc + '" fill="var(--ink-3)" font-family="var(--mono)" font-size="8.5">' + d.count + ' 项 · ' + esc(d.name) + '</text></g>');
    });
    el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="能力网络：' + M.domains + ' 个领域的真实能力数">' + o.join('') + '</svg>';
  }

  function renderComposer() {
    $('compChips').innerHTML = chip('folder', 'GBT小土豆V8') + chip('disk', '本地') + chip('branch', esc(RT.git_branch));
    $('permPill').textContent = '⊙ ' + esc(RT.permission || '—');
    $('modelPill').textContent = esc(RT.model_provider) + ' · ' + esc(RT.model) + ' · 思考 ' + esc(RT.effort);
  }
  function chip(kind, label) {
    var d = { folder: 'M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z',
      disk: 'M4 6h16v12H4zM8 10h8', branch: 'M6 3v12M6 15a3 3 0 106 0M12 9h4a2 2 0 012 2v2' }[kind];
    return '<span class="cchip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="' + d + '"/></svg>' + label + '</span>';
  }

  function setNav(k) {
    st.nav = k;
    $('navList').querySelectorAll('.navitem').forEach(function (x) { x.setAttribute('aria-current', String(x.dataset.nav === k)); });
    renderPanel();
    if (window.matchMedia('(max-width:1023px)').matches) $('nav').classList.remove('open');
  }

  $('navList').addEventListener('click', function (e) {
    var b = e.target.closest('.navitem'); if (!b) return; setNav(b.dataset.nav);
  });
  $('chatBody').addEventListener('click', function (e) {
    var o = e.target.closest('[data-open]');
    if (o) { setNav(o.dataset.open); return; }
    var d = e.target.closest('[data-domain]');
    if (d) {
      st.nav = 'square'; setNav('square');
      $('chatBody').scrollTop = 0;
    }
  });
  $('sessList').addEventListener('click', function (e) {
    var b = e.target.closest('.sess'); if (!b) return;
    st.sess = b.dataset.sess === '__new' ? null : b.dataset.sess;
    st.thread = []; setNav('chat'); renderSessions();
    if (window.matchMedia('(max-width:1279px)').matches) $('sessions').classList.remove('open');
  });
  $('newChat').addEventListener('click', function () { st.sess = null; st.thread = []; setNav('chat'); renderSessions(); $('input').focus(); });

  function syncSend() { $('sendBtn').disabled = st.busy || !$('input').value.trim(); }
  $('input').addEventListener('input', syncSend);
  $('input').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  $('sendBtn').addEventListener('click', send);
  function send() {
    var t = $('input').value.trim(); if (!t || st.busy) return;
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    st.thread.push({ role: 'me', text: t, at: p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) });
    st.thread.push({ role: 'gbt', text: '已收到。真实调用走框架入口 run_task：先落审计、过策略、再执行。\n本原型不发任何网络请求，所以这里不给你编一份回执 —— 点右上角「上帝视角」或左侧「大脑执行层」看真实读数。', at: '即时' });
    $('input').value = ''; st.busy = true; syncSend();
    $('sendBtn').innerHTML = '<span class="spin"></span>';
    if (st.nav !== 'chat') setNav('chat'); else renderPanel();
    window.setTimeout(function () {
      st.busy = false;
      $('sendBtn').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
      syncSend();
    }, 700);
  }

  $('godBtn').addEventListener('click', function () { $('god').classList.add('open'); st.godLoaded = false; renderGod(); $('godClose').focus(); });
  $('godClose').addEventListener('click', function () { $('god').classList.remove('open'); });
  $('god').addEventListener('click', function (e) { if (e.target === $('god')) $('god').classList.remove('open'); });
  $('godBody').addEventListener('click', function (e) {
    var n = e.target.closest('.node'); if (!n) return;
    $('god').classList.remove('open'); setNav('domains');
  });
  window.addEventListener('resize', function () { if ($('god').classList.contains('open')) drawNet(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { $('god').classList.remove('open'); $('nav').classList.remove('open'); $('sessions').classList.remove('open'); }
  });
  $('themeBtn').addEventListener('click', function () {
    st.theme = st.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', st.theme);
    if (st.nav === 'settings') renderPanel();
  });
  $('navToggle').addEventListener('click', function () { $('nav').classList.toggle('open'); $('sessions').classList.remove('open'); });
  $('sessToggle').addEventListener('click', function () { $('sessions').classList.toggle('open'); $('nav').classList.remove('open'); });

  /* 品牌 Logo：静态位补 src（data URI 只存一份，不重复内嵌）*/
  Array.prototype.forEach.call(document.querySelectorAll('.logo img'), function (im) {
    im.src = BRAND.logo;
  });
  renderSessions(); renderComposer(); renderPanel(); syncSend();
})();
</script>
<script id="cine-motion">
/* V21 · 影视氛围层的运动编排（只做两件事：面板入场错的节奏、画布开场的镜头落位）*/
(function () {
  'use strict';
  var reduce = false;
  try {
    reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { /* 老浏览器当作不降级 */ }

  /* ① 给容器直接子元素编号，供 CSS 的 animation-delay: calc(min(var(--ci),11) * 42ms) 使用
        注意：第 13 个之后必须显式写 11。若留空，var(--ci,0) 会回落到 0，
        后面的元素反而比前面的先出现 —— 级联顺序就反了。 */
  function cineStagger(root) {
    if (!root) return;
    var kids = root.children;
    for (var i = 0; i < kids.length; i++) {
      var v = String(i < 11 ? i : 11);
      if (kids[i].style.getPropertyValue('--ci') !== v) kids[i].style.setProperty('--ci', v);
    }
  }
  function cineStaggerAll() {
    cineStagger(document.getElementById('chatBody'));
    cineStagger(document.getElementById('godBody'));
  }
  cineStaggerAll();

  /* 面板内容是整体替换 innerHTML 的，用 MutationObserver 兜住所有渲染路径
     （比包 renderPanel 更稳：panelChat 之类的直接被调也照样生效）
     只监听 childList —— 我们改的是 style 自定义属性，不会自触发。 */
  try {
    var mo = new MutationObserver(function () { cineStaggerAll(); });
    ['chatBody', 'godBody'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) mo.observe(el, { childList: true });
    });
  } catch (e) { /* 无 MutationObserver 就退化成只在初始化编排一次 */ }

  /* ② 画布开场：镜头从略远处落位。只用一次性 transform 过渡，落位后立刻摘掉过渡，
        否则之后平移/缩放的每一帧都会被过渡拖住。 */
  if (!reduce && typeof zoom === 'number' && document.getElementById('world')) {
    try {
      var w = document.getElementById('world');
      var z0 = zoom, px = panX, py = panY;
      w.style.transition = 'none';
      zoom = z0 * 0.945; panX = px + 44; panY = py + 28;
      updateTransform();
      window.requestAnimationFrame(function () {
        w.style.transition = 'transform 1.05s cubic-bezier(.16,1,.3,1)';
        zoom = z0; panX = px; panY = py;
        updateTransform();
        window.setTimeout(function () { w.style.transition = ''; }, 1250);
      });
    } catch (e) { /* 没有画布环境就跳过 */ }
  }
})();
</script>
