# GBT小土豆V8 · 容器落点配置（**单独一份，不许拿去替换主部署配置**）
# 开发者：自由的风 · 守护者：公主土豆 · 禁止删除
#
# 🔴 为什么单独一份：主部署 `wrangler.toml` 现在是**已在云上跑着的那一份**（30/30 通过）。
#    容器这条线有两件硬前提没满足（账号要升 Workers Paid · 本机 Docker 引擎没起），
#    所以把容器相关的东西**隔离在这里** —— 主线分毫不动，等前提满足了再合。
#
# 前提（2026-09-25 现读）：
#   · 账号是免费计划 ⇒ 官方原话「Deploying containers requires the Workers Paid plan」（$5/月）
#   · `docker ps` ⇒ failed to connect to npipe:////./pipe/dockerDesktopLinuxEngine（引擎没跑）
#
# 满足之后的命令（**都没跑过，别当已验证**）：
#   wrangler containers build deploy/cloud-10/container -t gbt-potato-infer:0.1
#   wrangler containers push gbt-potato-infer:0.1
#   wrangler deploy -c deploy/cloud-10/wrangler.container.toml

name = "gbt-potato-cloud-10"
main = "src/worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

[ai]
binding = "AI"

[vars]
LLM_ENDPOINT = ""
UNCENSORED_ENDPOINT = ""
NS_PREFIX = "mesh10/"
GRANTED_SCOPES = "external_llm,filesystem_read,filesystem_write,network_read"

[[kv_namespaces]]
binding = "MEM"
id = "caad048b525b41d8b7f9bb0bd8addda0"

[[kv_namespaces]]
binding = "CTX"
id = "5dd283b077d04009b35e0b1a4f4dcdb0"

[[r2_buckets]]
binding = "FILES"
bucket_name = "gbt-bigfiles"

[[r2_buckets]]
binding = "LEDGER"
bucket_name = "gbt-bigfiles"

# ── 容器落点（官方档位现读：standard-2 = 1 vCPU / 6 GiB 内存 / 12 GB 磁盘）──
# 为什么是 standard-2 而不是 standard-1：3.87 GiB 的模型 + 进程开销 > 4 GiB，**太紧**。
# ⚠️ 容器是 **vCPU（无 GPU）**：出图会很慢 —— 这条写进容器自己的 /health。
[[containers]]
class_name = "GbtInferContainer"
image = "gbt-potato-infer:0.1"
instance_type = "standard-2"
max_instances = 1

[[durable_objects.bindings]]
class_name = "GbtInferContainer"
name = "SANDBOX"

[[migrations]]
new_sqlite_classes = ["GbtInferContainer"]
tag = "v1"

[observability]
enabled = true
