# GBT小土豆V8 · 10 云插件拼接网 · 形态 A（10 模块同一 isolate）
# 开发者：自由的风 · 守护者：公主土豆 · 禁止删除
#
# 形态 A 是真共享 CPU 的唯一样子：10 个模块编进同一个 Worker ⇒ 同一 isolate，
# CPU/内存配额是这一份的；modules/ 下那 10 个独立件是形态 B（真互通、各算各的）。
#
# ⚠️ 本文件用的是**主人账号里已有的**资源（现读：KV 4 个 · R2 1 个 · D1 4 个），
#    没有新建任何云资源。为不碰主人原有数据，全部键走 mesh10/ 前缀（见 src/modules.js 的 NS_PREFIX）。
#
# 部署顺序（都不许跳）：
#   1) 本文件占位符清零（现在 0 处）
#   2) 主人拍板 wrangler deploy（这一步才真改远端：会在账号里建一个 Worker）
#   3) deploy → 量真读数（身份漂移 / 拒答率 / 遥测 / 装机验收）
#
# 🔴🔴 **必须显式带 `--config wrangler.toml`**（2026-09-25 实测踩到，不是理论风险）：
#      `deploy/` **父目录另有一份 `wrangler.json` + `wrangler.toml`**（一个 Pages 项目）。
#      不加 `--config` 时 wrangler 读的是**父目录那份** ⇒ 实测报
#        「It seems that you have run `wrangler deploy` on a Pages project…」
#        「✘ Missing entry-point to Worker script or to assets directory」
#      —— 也就是**会部到错的项目上**（或直接失败），而不是部这个 Worker。
#      正确命令（在本目录下跑）：
#        wrangler deploy --config wrangler.toml
#
# 现存已知缺口（部署后读数会如实报，不假装有）：
#   · 06 号命令：容器没建（要 Workers Paid 计划 + Docker 引擎） ⇒ exec 如实拒
#   · 03 号无审查通道：没有自托管权重端点 ⇒ 未读到
#   · 01 号模型：Workers AI 的权重不是我们的，平台侧内容策略仍在 ⇒ 能干活，但不是"无限制"
#   · 04 号检索：AI Search 实例未建（要先到 https://dash.cloudflare.com 生成 AI Search API token）

name = "gbt-potato-cloud-10"
main = "src/worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

# ── 模型面 ────────────────────────────────────────────────────────────────
[ai]
binding = "AI"

[vars]
# 自托管 OpenAI 兼容端点（真无限制那条只走这里）。没接线时读数=未读到。
LLM_ENDPOINT = ""
UNCENSORED_ENDPOINT = ""
IMAGE_ENDPOINT = ""

# 🔐 统一密钥口 —— **只有大模型用这一个 key**，其它模块间双向直连不走密钥。
#   值来自环境 OPENAI_API_KEY（已配：sk-teamo-...），由 host credentials 管理。
#   01/03 号模块用它打自建端点；Workers AI 走平台侧，不消费这个 key。
LLM_API_KEY = "<从 OPENAI_API_KEY 环境变量取，不在源码里写>"

# 🔑 网关鉴权（模块间双向调用时用，内网互认）+ 主人令牌（/admin/grant 身份）
#   🔴🔴 2026-10-04 纪律恢复：**令牌绝不许写在这份文件里**（它是入库的明文）。
#       这里**故意不写值** —— 代码读的是同名绑定，用 secret 注入（每次改只需重灌 secret）：
#         wrangler secret put GW_AUTH    --config wrangler.toml
#         wrangler secret put OWNER_TOKEN --config wrangler.toml
#       没设 GW_AUTH ⇒ /v1/chat 与 /rpc 的鉴权 fail-closed 拒服务（2026-10-04 起，不再静默放行）；
#       没设 OWNER_TOKEN ⇒ /admin/grant 本来就拒（worker.js L560 已 fail-closed），不用动。
#   （本文件历史上有过一版明文入库 —— 已从工作区清掉；**已泄漏的那把请主人轮换掉**。）

# 换文案只改这一处（modules.js:155,275 读它）
GBT_IDENTITY = ""

# Workers AI 的模型 id
WORKERS_AI_MODEL = "@cf/openai/gpt-oss-120b"

# 本网落盘前缀（与 src/modules.js 的 NS_PREFIX 必须一致）
NS_PREFIX = "mesh10/"

# ── 授权：模块间全双向直连，不过门 ───────────────────────────────────────
# 只有 external_llm（01/03 打出外网的那两道）保留门：平台侧需要鉴权。
# 删掉这一行 = 模型面全关。其余所有内部 op 都是 none，模块互相调用零门槛。
GRANTED_SCOPES = "external_llm"

# ── 记忆面（复用已有 KV；两处绑定同一个库也可以，这里分开用）──────────────
[[kv_namespaces]]
binding = "MEM"
id = "caad048b525b41d8b7f9bb0bd8addda0"   # 现读：BRAIN_KV

[[kv_namespaces]]
binding = "CTX"
id = "5dd283b077d04009b35e0b1a4f4dcdb0"   # 现读：gbt-canary-kv

# ── 对象存储（复用已有桶；键都在 mesh10/ 下）──────────────────────────────
[[r2_buckets]]
binding = "FILES"
bucket_name = "gbt-bigfiles"

[[r2_buckets]]
binding = "LEDGER"
bucket_name = "gbt-bigfiles"

# ── D1：07 号向量的降级落点 ───────────────────────────────────────────────
# 主人账号里现读 4 个库都是别的用途（gbt-orders-a/b · gbt-caps · gbt-wallet），
# 往里写我们的向量表会把别人的库弄脏 ⇒ 这一项**故意留空**：
#   要么主人同意新建一个 gbt-memory（那是一条真改远端的动作，要主人点头），
#   要么就让 07 号落 isolate 内存（读数会如实报 sink=isolate-memory，重启即失）。
# [[d1_databases]]
# binding = "DB"
# database_name = "<未配：主人同意新建后填>"
# database_id = "<未配：主人同意新建后填>"

# ── 向量记忆（07 号）：已建 gbt-mesh-vectors，32 维 cosine ─────────────────
[[vectorize]]
binding = "VECTORIZE"
index_name = "gbt-mesh-vectors"

# ── 检索面 / 算力面 / 观测面：资源未建 ⇒ 只留形状，不许写成已接线 ─────────
# AI Search（04 号检索）：需要先到 https://dash.cloudflare.com → AI → AI Search → Tokens
#   生成 token 后跑：wrangler ai-search create gbt-mesh-search
# [[ai_search]]
# binding = "AI_SEARCH"
# instance_name = "gbt-mesh-search"

# 容器（06 号命令执行）：要 Workers Paid 计划 + Docker 引擎。
# 满足后跑：wrangler containers build deploy/cloud-10/container -t gbt-potato-infer:0.1
#           wrangler containers push gbt-potato-infer:0.1
# [[containers]]
# class_name = "GbtInferContainer"
# image = "gbt-potato-infer:0.1"
# instance_type = "standard-2"

# Analytics Engine（10 号观测面 AE）：wrangler 4.111 不支持 cli 建，要到控制台手动建
# [[analytics_engine_datasets]]
# binding = "AE"
# dataset = "gbt-mesh-logs"

[observability]
enabled = true
