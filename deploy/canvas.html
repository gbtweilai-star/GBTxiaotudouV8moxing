<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #04070f; --bg-subtle: #08111f; --surface: #0c1a2e; --surface-raised: #102339;
    --border: rgba(88,196,255,0.14); --border-hover: rgba(88,196,255,0.34);
    --accent: #2ad4f0; --accent-dim: rgba(42,212,240,0.12);
    --text: #dff2fb; --text-secondary: rgba(223,242,251,0.74); --text-tertiary: rgba(223,242,251,0.54);
    --shadow-sm: 0 0 8px rgba(42,212,240,0.12);
    --shadow-md: 0 0 22px rgba(42,212,240,0.18);
    --shadow-lg: 0 0 40px rgba(42,212,240,0.22);
    --shadow-drag: 0 20px 60px rgba(0,0,0,0.55), 0 0 0 1.5px var(--accent);
    --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 18px;
    --font-sans: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
    --note-bg: #0c1a2e; --note-border: rgba(42,212,240,0.28);
    --transition-fast: 120ms cubic-bezier(0.25, 0.1, 0.25, 1);
    --transition-normal: 200ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-sans);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 512px 512px;
    mix-blend-mode: overlay;
  }

  /* ===== canvas viewport ===== */
  .canvas-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
  }
  .canvas-viewport.panning { cursor: grabbing; }

  .canvas-world {
    position: absolute;
    left: 0; top: 0;
    width: 20000px; height: 20000px;
    transform-origin: 0 0;
    will-change: transform;
  }

  /* ===== dot grid ===== */
  .canvas-viewport {
    --grid-color: rgba(88,196,255,0.06);
  }

  /* ===== draggable elements ===== */
  .canvas-el {
    position: absolute;
    cursor: grab;
    transition: box-shadow var(--transition-normal), transform var(--transition-fast);
  }
  .canvas-el:hover { z-index: 10; }
  .canvas-el.dragging {
    cursor: grabbing;
    z-index: 999;
    box-shadow: var(--shadow-drag) !important;
    transform: scale(1.01);
    transition: none;
  }

  /* ===== section header ===== */
  .section-header {
    position: absolute;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 16px;
    white-space: nowrap;
  }
  .section-header .section-num {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--accent);
    opacity: 0.8;
  }
  .section-header .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .section-header .section-line {
    flex: none;
    width: 48px;
    height: 1px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
    opacity: 0.3;
  }

  .canvas-title {
    position: absolute;
    pointer-events: none;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.025em;
    color: var(--text);
  }

  /* ===== text block ===== */
  .canvas-text {
    position: absolute;
    line-height: 1.7;
    letter-spacing: 0.005em;
    color: var(--text-secondary);
    min-width: 200px;
    max-width: 560px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ===== tag ===== */
  .canvas-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: border-color var(--transition-fast), background var(--transition-fast);
    white-space: nowrap;
  }
  .canvas-tag:hover {
    border-color: var(--border-hover);
    background: var(--surface-raised);
  }
  .canvas-tag .tag-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  /* ===== context card ===== */
  .context-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    min-width: 220px;
    transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
  }
  .context-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
  }
  .context-card .card-head {
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .context-card .card-head .head-indicator {
    width: 3px;
    height: 16px;
    border-radius: 2px;
    background: var(--accent);
    flex-shrink: 0;
  }
  .context-card .card-head h3 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text);
  }
  .context-card .card-content {
    padding: 0 20px 20px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-secondary);
  }
  .context-card .card-content ul {
    list-style: none;
    padding: 0;
  }
  .context-card .card-content li {
    padding: 4px 0;
    padding-left: 12px;
    position: relative;
  }
  .context-card .card-content li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 11px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text-tertiary);
  }

  /* ===== design system card ===== */
  .ds-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
  }
  .ds-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
  }
  .ds-card .ds-head {
    padding: 16px 20px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .ds-card .ds-body {
    padding: 0 20px 20px;
  }

  /* color type */
  .ds-card .color-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
    gap: 8px;
  }
  .ds-card .color-chip {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    position: relative;
    transition: transform var(--transition-fast);
  }
  .ds-card .color-chip:hover { transform: scale(1.08); }
  .ds-card .color-chip .chip-label {
    position: absolute;

<style id="cine">
/* ══════════════════════════════════════════════════════════════════════════
   V21 · 影视氛围层（cinematic atmosphere）
   设计读法：dark-tech capability console for its single owner，
             cinematic / deep-space instrument-panel，原生 CSS 分层 + 一套克制的运动系统。
   档位：DESIGN_VARIANCE 4（沿用既有）· MOTION_INTENSITY 5（原 2，+3）· VISUAL_DENSITY 8（沿用）
   ══════════════════════════════════════════════════════════════════════════
   z-index 刻度（全项目唯一口径，不再随手写数字）：
     0     氛围层（极光 / 暗角）：固定、pointer-events:none
     1     内容层（.app / .canvas-viewport）
     10    卡片悬浮
     880+  既有抽屉与模态（不改）
     9000  胶片颗粒：最上层、pointer-events:none
   运动规范：
     · 只动 transform / opacity，绝不动 top/left/width/height
     · 无限循环与入场编排在 prefers-reduced-motion 下一律静止
     · 颗粒只挂在固定不滚动的伪元素上（不在滚动容器上做滤镜）
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 1. 极光：两团超大径向渐变，只靠 transform 缓慢漂移（无 blur 滤镜，径向衰减自带柔化）── */
.cine-atmo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cine-atmo i{position:absolute;display:block;border-radius:50%;will-change:transform}
.cine-a{width:86vw;height:86vw;left:-22vw;top:-30vw;
  background:radial-gradient(circle,rgba(42,212,240,.20) 0%,rgba(42,212,240,.075) 34%,rgba(42,212,240,0) 68%);
  animation:cineDrift1 68s ease-in-out infinite}
.cine-b{width:72vw;height:72vw;right:-18vw;bottom:-26vw;
  background:radial-gradient(circle,rgba(110,242,255,.15) 0%,rgba(110,242,255,.05) 36%,rgba(110,242,255,0) 70%);
  animation:cineDrift2 88s ease-in-out infinite}
.cine-c{width:52vw;height:52vw;left:44vw;top:34vh;
  background:radial-gradient(circle,rgba(58,120,220,.13) 0%,rgba(58,120,220,0) 66%);
  animation:cineDrift3 104s ease-in-out infinite}
@keyframes cineDrift1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,5vh,0) scale(1.14)}}
@keyframes cineDrift2{0%,100%{transform:translate3d(0,0,0) scale(1.1)}50%{transform:translate3d(-5vw,-4vh,0) scale(1)}}
@keyframes cineDrift3{0%,100%{transform:translate3d(0,0,0) scale(.94)}50%{transform:translate3d(-7vw,6vh,0) scale(1.08)}}

/* ── 2. 暗角：把注意力压回画面中心 ── */
.cine-v{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(126% 92% at 50% 40%,transparent 40%,rgba(0,0,0,.42) 78%,rgba(0,0,0,.62) 100%)}

/* ── 3. 胶片颗粒：固定伪元素、不挡点击、不参与滚动重绘 ── */
body::after{content:'';position:fixed;inset:0;z-index:9000;pointer-events:none;opacity:.05;
  background-repeat:repeat;background-size:170px 170px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='170' height='170' filter='url(%23n)'/></svg>")}

/* ── 4. 面板入场编排：一次有节奏的到位，而不是散落的微动效 ── */
@keyframes cineRise{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:none}}
#chatBody>*,#godBody>*{animation:cineRise .54s cubic-bezier(.16,1,.3,1) both;
  animation-delay:calc(min(var(--ci,0),11) * 42ms)}

/* ── 5. 卡片：顶部来光 + 着色阴影（不是纯黑投影）+ 悬浮抬升 ── */
.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 34px -22px rgba(0,0,0,.9);
  transition:transform var(--t),border-color var(--t),box-shadow var(--t)}
.card:hover{transform:translate3d(0,-2px,0);border-color:var(--line-hot);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.085),0 22px 48px -24px rgba(42,212,240,.34)}
.card-h{background:linear-gradient(180deg,rgba(88,196,255,.062),rgba(88,196,255,0))}

/* ── 6. 读数发光：让数字像仪表灯，而不是印刷体 ── */
[style*="color:var(--neon-2)"]{text-shadow:0 0 15px rgba(42,212,240,.32)}
.statline .n{text-shadow:0 0 12px rgba(42,212,240,.22)}

/* ── 7. 进度条：轨道内凹 + 填充发光 ── */
.track{box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
.track i{box-shadow:0 0 12px rgba(42,212,240,.55)}
.track i.warn{box-shadow:0 0 12px rgba(245,181,68,.5)}
.track i.rose{box-shadow:0 0 12px rgba(255,122,122,.5)}

/* ── 8. 导航：当前项一道左侧光条 + 内侧溢光 ── */
.navitem[aria-current="true"]{box-shadow:inset 2px 0 0 var(--neon),inset 0 0 26px rgba(42,212,240,.10)}
.navitem{transition:background var(--t),color var(--t),box-shadow var(--t)}

/* ── 9. 顶栏 / 面板头：下缘一层自上而下的微光 ── */
.top,.chat-top{background-image:linear-gradient(180deg,rgba(88,196,255,.055),rgba(88,196,255,0))}

/* ── 10. 按钮触感：按下时下沉 1px（§4.5 tactile feedback）── */
.iconbtn:active,.godbtn:active,.pill:active,.qchip:active,.navitem:active,.send:active,.newchat:active{transform:translate3d(0,1px,0)}
.iconbtn,.godbtn,.pill,.qchip,.send,.newchat{transition:transform var(--t),border-color var(--t),color var(--t),background var(--t)}

/* ── 11. 上帝视角：更深的纵深，像一层浮在数据之上的观察窗 ── */
.god-panel{box-shadow:0 0 0 1px rgba(42,212,240,.10),0 40px 120px -40px rgba(42,212,240,.30),
  0 0 90px rgba(42,212,240,.12)}

/* ── 12. 画布页：只对「页」做纵深，不对卡片/便签做（用 :has 限定）── */
.canvas-el:has(> .design-page){box-shadow:0 28px 74px -40px rgba(0,0,0,.95),0 0 0 1px rgba(88,196,255,.05);
  transition:transform var(--t),box-shadow var(--t)}
.canvas-el:has(> .design-page):hover{transform:translate3d(0,-3px,0);
  box-shadow:0 38px 96px -42px rgba(0,0,0,.95),0 0 0 1px rgba(42,212,240,.22),0 0 54px -12px rgba(42,212,240,.20)}
.canvas-el.dragging,.canvas-el.dragging:has(> .design-page){transform:none}
.page-label{text-shadow:0 0 14px rgba(42,212,240,.30);letter-spacing:.06em}
.page-label .label-num{text-shadow:0 0 12px rgba(42,212,240,.55)}

/* ── 13. 降低动态：无限循环静止、入场取消、悬浮不位移 ── */
@media (prefers-reduced-motion:reduce){
  .cine-atmo i{animation:none!important}
  #chatBody>*,#godBody>*{animation:none!important;opacity:1!important;transform:none!important}
  .card:hover,.canvas-el:has(> .design-page):hover{transform:none}
  .iconbtn:active,.godbtn:active,.pill:active,.qchip:active,.navitem:active,.send:active,.newchat:active{transform:none}
}
</style>
<style id="refine">
/* ── V21 · 真渲染揪出的布局 bug（影响所有面板）──
   .chat-body 是 display:flex;flex-direction:column;overflow-y:auto。
   列向 flex 的子项默认 flex-shrink:1 —— 内容比容器高时**不是滚动，而是被压缩**，
   再被 .card{overflow:hidden} 把压缩后的溢出裁掉 ⇒ 内容被静默切掉。
   实测：某卡片渲染高 248 / 内容高 268 以上，容器 scrollHeight===clientHeight（根本不滚）。
   修：面板直接子项一律不许收缩，容器这才真的滚动。 */
.chat-body>*,.god-body>*{flex:0 0 auto}
.god-body{overflow-y:auto}

/* ══════════════════════════════════════════════════════════════════════════
   V21 · 专业化打磨层（typography · rhythm · data craft）
   按 taste-skill §11.D 现代化杠杆：V15 做的是第 4 项（运动层），
   本层做第 1 项（字体排印，单位风险收益最高）与第 2 项（间距与节奏）。
   审计依据（改动前实测）：
     字重 1 档（600）· 行高 2 档 · 字距 7 档无规律
     gap 11 种值（4/5/6/7/8/9/10/11/12/14/15）· margin 7 种值
     font-variant-numeric 0 处 · tabular-nums 0 处 · ::selection 未定义
   原则：
     · 只动排版、间距与表面层级，不动结构、文案、数据、逻辑
     · 明暗两套主题都要成立 —— 一律走 token，不写死颜色
     · 不引入外部字体（交付件要单文件离线可开），靠系统栈的精修与字距字重建立层级
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 1. 刻度：字重 / 字距 / 行高 / 间距（2px 密排基 + 4px 骨架基）── */
:root{
  /* 字重刻度：原来只有 1 档，层级全靠字号撑 */
  --w-reg:400; --w-med:500; --w-sem:600; --w-bold:700;
  /* 字距刻度：把原来 7 个随手值收成 4 档 */
  --ls-display:-.022em;   /* 大读数、大标题 */
  --ls-tight:-.006em;     /* 正文密排 */
  --ls-caps:.08em;        /* 小号大写标签 */
  --ls-label:.14em;       /* 卡片头标签 */
  /* 行高刻度：原来只有 1.6 / 1.7 */
  --lh-display:1.05;      /* 大读数 */
  --lh-tight:1.38;        /* 单行标签、行内数据 */
  --lh-body:1.72;         /* 段落 */
  /* 间距刻度：2px 为最小步进（密排数据），4px 为骨架步进 */
  --sp-1:4px; --sp-2:6px; --sp-3:8px; --sp-4:10px;
  --sp-5:12px; --sp-6:16px; --sp-7:20px; --sp-8:24px; --sp-9:32px;
}

/* ── 2. 字体栈精修：光学尺寸 + 中文标点换行 + 合成控制 ── */
html{font-optical-sizing:auto;-webkit-text-size-adjust:100%}
body{
  font-weight:var(--w-reg);
  line-break:strict;            /* 中文标点不置行首 */
  text-rendering:optimizeLegibility;
  font-synthesis:none;          /* 该字重没有就不许伪加粗 */
}
/* 数字与代码：统一等宽数字，表格列才会真正对齐 */
.mono,[style*="var(--mono)"],.statline .n,.routebar code,.kv b{
  font-variant-numeric:tabular-nums lining-nums;
  font-feature-settings:"tnum" 1,"lnum" 1,"zero" 1;
}

/* ── 3. 排印层级：用字重 + 字距建立层次，而不是只放大字号 ── */
.card-h{
  font-weight:var(--w-med);letter-spacing:var(--ls-label);line-height:var(--lh-tight);
}
.card-h b{
  font-weight:var(--w-sem);letter-spacing:var(--ls-caps);
}
.card-h .r{font-weight:var(--w-reg);letter-spacing:var(--ls-caps)}
/* 大读数：收紧字距 + 加重 + 行高压紧，像仪表读数而不是正文 */
[style*="font-size:22px"],[style*="font-size:23px"],[style*="font-size:24px"],
[style*="font-size:26px"],[style*="font-size:30px"],[style*="font-size:19px"],
[style*="font-size:18px"],[style*="font-size:17px"]{
  font-weight:var(--w-bold);letter-spacing:var(--ls-display);line-height:var(--lh-display);
}
.statline .n{font-weight:var(--w-med);letter-spacing:var(--ls-tight);line-height:var(--lh-tight)}
.statline{line-height:var(--lh-tight)}
.routebar{line-height:var(--lh-tight)}
.kv{line-height:var(--lh-tight)}
p{line-height:var(--lh-body)}
/* 中文标题允许平衡断行；正文用 pretty */
.hero h1,.chat-top b{text-wrap:balance}
.hero p,.card-b>p{text-wrap:pretty}

/* ── 4. 间距与节奏：把散落值收到 2px 刻度上（chrome 一律走 token）── */
.chat-body{padding:var(--sp-8);gap:var(--sp-6)}
.grid2,.grid3{gap:var(--sp-5)}
.card-h{padding:var(--sp-3) var(--sp-5)}
.card-b{padding:var(--sp-5)}
.kv{gap:var(--sp-2) var(--sp-5)}
.routebar{gap:var(--sp-3);padding:var(--sp-1) 0}
.grow1,.grow2{gap:var(--sp-5)}

/* 数据行：让高亮能向外溢一点，文字起点不变（负 margin 由内边距补回）── */
.statline{
  gap:var(--sp-4);padding:var(--sp-1) var(--sp-3);margin:0 calc(var(--sp-3) * -1);
  border-radius:var(--r-sm);
  transition:background var(--t);
}
.statline:hover{background:var(--neon-dim)}
.routebar{
  padding-left:var(--sp-3);padding-right:var(--sp-3);
  margin:0 calc(var(--sp-3) * -1);border-radius:var(--r-sm);
  transition:background var(--t);
}
.routebar:hover{background:var(--neon-dim)}
/* 行内分隔线只留最淡的一道，避免密集虚线把版面切碎 */
.routebar{border-bottom-color:var(--line)}

/* ── 5. 表面层级：主表面抬起、内嵌表面下沉（§4.4 卡片只在表达层级时用）── */
.card:not(.card .card){
  background:var(--panel);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 34px -22px rgba(0,0,0,.9);
}
.card .card{
  background:var(--panel-2);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.32);
  border-color:var(--line);
}
/* 明色主题下下沉阴影要反过来，否则会脏 */
[data-theme="light"] .card .card{box-shadow:inset 0 1px 2px rgba(16,24,32,.06)}
[data-theme="light"] .card:not(.card .card){
  box-shadow:0 1px 2px rgba(16,24,32,.06),0 8px 24px -18px rgba(16,24,32,.28);
}

/* ── 6. 细节工艺 ── */
::selection{background:rgba(42,212,240,.30);color:var(--ink)}
[data-theme="light"] ::selection{background:rgba(10,125,148,.22);color:var(--ink)}
/* 焦点环：跟随圆角，不再是一个方框套在圆角元素上 */
:focus-visible{outline:2px solid var(--neon);outline-offset:2px;border-radius:var(--r-sm)}
/* 徽标/胶囊里的数字也用等宽数字，避免宽度跳动 */
.pill,.qchip,.badge,.cap{font-variant-numeric:tabular-nums}
/* 长 token（路径、指纹、sha）在窄列里允许断行，避免撑破网格 */
.mono{overflow-wrap:anywhere;word-break:normal}
.statline .n,.routebar code{overflow-wrap:normal}

/* ── 7. 画布页：同样把排印层级与数字工艺带过去 ── */
.page-label{font-weight:var(--w-med);letter-spacing:var(--ls-caps)}
.page-label .label-num{font-variant-numeric:tabular-nums;font-weight:var(--w-sem)}
.ds-card .ds-title,.canvas-note .note-tag{letter-spacing:var(--ls-label)}
.ds-card,.canvas-note,.canvas-title,.canvas-text{line-break:strict}
</style>
</head>
<body>
<div class="cine-atmo" aria-hidden="true">
  <i class="cine-a"></i><i class="cine-b"></i><i class="cine-c"></i>
</div>
<div class="cine-v" aria-hidden="true"></div>

<div class="canvas-viewport" id="viewport">
  <div class="canvas-world" id="world"></div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" id="zoomOut" aria-label="">&#8722;</button>
  <div class="zoom-label" id="zoomLabel">100%</div>
  <button class="zoom-btn" id="zoomIn" aria-label="">+</button>
  <button class="zoom-btn" id="zoomReset" title="" aria-label="">&#8962;</button>
</div>

<div class="coord-indicator" id="coordIndicator">0, 0</div>

<div class="kbd-hint" id="kbdHint"></div>

<script>
(() => {
  // ═══════════════════════════════════════════════════════════
  // LOCALIZE: instantiating agent MUST translate every value in
  // UI_STRINGS to the user's conversation language. Machine fields
  // (id/class/data-*) remain English.
  // ═══════════════════════════════════════════════════════════
  const UI_STRINGS = {
    docTitle: 'GBT小土豆V8 · 能力中枢 · 无限画布 V21',
    zoom: { zoomIn: '放大', zoomOut: '缩小', reset: '复位视图' },
    kbdHints: [['滚动', '平移'], ['⌘滚动', '缩放'], ['⌘Z', '撤销']],
    sections: { context: '01 项目背景', designSystem: '02 设计系统', deliverables: '03 设计稿' },
  signatureTag: '开发者',
  signature: '开发者：自由的风 · GBT小土豆V8 · 本署名不可删除、不可篡改归属 · V21 · 55 面板 / 58 画布页 · 原生浏览器与云电脑已补',
  };

  // Chrome strings live in UI_STRINGS too — applied here so the static HTML
  // above carries no visible copy at all (machine-checkable invariant).
  document.title = UI_STRINGS.docTitle;
  document.getElementById('zoomIn').setAttribute('aria-label', UI_STRINGS.zoom.zoomIn);
  document.getElementById('zoomOut').setAttribute('aria-label', UI_STRINGS.zoom.zoomOut);
  document.getElementById('zoomReset').setAttribute('aria-label', UI_STRINGS.zoom.reset);
  document.getElementById('kbdHint').innerHTML = UI_STRINGS.kbdHints
    .map(([keys, action]) => `<span><kbd>${keys}</kbd> ${action}</span>`)
    .join('');

  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const zoomLabel = document.getElementById('zoomLabel');
  const coordIndicator = document.getElementById('coordIndicator');

  /* ===== canvas state ===== */
  let panX = 0, panY = 0, zoom = 1;
  const MIN_ZOOM = 0.05, MAX_ZOOM = 8;

  function updateTransform() {
    world.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    updateGrid();
  }

  /* ===== dot grid ===== */
  function updateGrid() {
    const g = 40 * zoom;
    const ox = panX % g, oy = panY % g;
    viewport.style.backgroundImage = `radial-gradient(circle, var(--grid-color) 0.8px, transparent 0.8px)`;
    viewport.style.backgroundSize = `${g}px ${g}px`;
    viewport.style.backgroundPosition = `${ox}px ${oy}px`;
  }

  /* ===== panning ===== */
  let isPanning = false, panSX, panSY;

  viewport.addEventListener('pointerdown', (e) => {
    if (e.target === viewport || e.target === world) {
      isPanning = true;
      panSX = e.clientX - panX;
      panSY = e.clientY - panY;
      viewport.classList.add('panning');
      viewport.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!isPanning) return;
    panX = e.clientX - panSX;
    panY = e.clientY - panSY;
    updateTransform();
  });
  viewport.addEventListener('pointerup', () => {
    isPanning = false;
    viewport.classList.remove('panning');
  });

  /* ===== wheel: trackpad scroll = pan, pinch/ctrl+scroll = zoom ===== */
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();

    if (e.ctrlKey || e.metaKey) {
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      const factor = e.deltaY > 0 ? 0.95 : 1.05;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    } else {
      const hasX = Math.abs(e.deltaX) > 0.5;
      if (hasX || Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.3) {
        panX -= e.deltaX;
        panY -= e.deltaY;
      } else {
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
        const factor = e.deltaY > 0 ? 0.95 : 1.05;
        zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
        panX = mx - wx * zoom;
        panY = my - wy * zoom;
      }
    }
    updateTransform();
  }, { passive: false });

  /* ===== zoom buttons ===== */
  function zoomAt(factor) {
    const r = viewport.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    panX = cx - wx * zoom;
    panY = cy - wy * zoom;
    updateTransform();
  }
  document.getElementById('zoomIn').onclick = () => zoomAt(1.25);
  document.getElementById('zoomOut').onclick = () => zoomAt(0.8);
  document.getElementById('zoomReset').onclick = () => { zoom = 1; panX = 0; panY = 0; updateTransform(); };
  document.getElementById('zoomReset').title = UI_STRINGS.zoom.reset;

  /* ===== coord indicator ===== */
  viewport.addEventListener('pointermove', (e) => {
    if (isPanning) return;
    const r = viewport.getBoundingClientRect();
    coordIndicator.textContent = `${Math.round((e.clientX - r.left - panX) / zoom)}, ${Math.round((e.clientY - r.top - panY) / zoom)}`;
  });

  /* ===== touch gestures ===== */
  let lastPinchDist = null, lastPinchCenter = null;

  viewport.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const t0 = e.touches[0], t1 = e.touches[1];
      lastPinchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      lastPinchCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
      e.preventDefault();
    }
  }, { passive: false });

  viewport.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const center = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
    if (lastPinchDist > 0) {
      const r = viewport.getBoundingClientRect();
      const mx = center.x - r.left, my = center.y - r.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * Math.pow(dist / lastPinchDist, 0.6)));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    }
    if (lastPinchCenter) {
      panX += center.x - lastPinchCenter.x;
      panY += center.y - lastPinchCenter.y;
    }
    lastPinchDist = dist;
    lastPinchCenter = center;
    updateTransform();
  }, { passive: false });

  viewport.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) { lastPinchDist = null; lastPinchCenter = null; }
  });

  /* ===== undo ===== */
  const undoStack = [];
  function saveUndo() {
    const s = [];
    world.querySelectorAll('.canvas-el').forEach(el => {
      s.push({ id: el.id, left: el.style.left, top: el.style.top });
    });
    undoStack.push({ panX, panY, zoom, assets: s });
    if (undoStack.length > 60) undoStack.shift();
  }
  function undo() {
    if (!undoStack.length) return;
    const st = undoStack.pop();
    panX = st.panX; panY = st.panY; zoom = st.zoom;
    st.assets.forEach(a => {
      const el = document.getElementById(a.id);
      if (el) { el.style.left = a.left; el.style.top = a.top; }
    });
    updateTransform();
  }
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  });

  /* ===== draggable ===== */
  function makeDraggable(el) {
    let dragging = false, sx, sy, ox, oy;
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      dragging = true;
      el.classList.add('dragging');
      saveUndo();
      sx = e.clientX; sy = e.clientY;
      ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
      el.setPointerCapture(e.pointerId);
      e.stopPropagation();
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      el.style.left = (ox + (e.clientX - sx) / zoom) + 'px';
      el.style.top = (oy + (e.clientY - sy) / zoom) + 'px';
    });
    el.addEventListener('pointerup', () => {
      if (dragging) { dragging = false; el.classList.remove('dragging'); }
    });
  }

  /* ===== unique id ===== */
  let _id = 0;
  function uid(prefix) { return (prefix || 'el') + '-' + (++_id); }

  /* ===== API: addSection ===== */
  function addSection(rowY, label) {
    const parts = label.split(' ');
    const num = parts[0] || '';
    const rest = parts.slice(1).join(' ');
    const el = document.createElement('div');
    el.className = 'section-header';
    el.style.left = '60px';
    el.style.top = rowY + 'px';
    el.innerHTML = `<span class="section-line"></span><span class="section-num">${num}</span><span class="section-label">${rest}</span>`;
    world.appendChild(el);
    return rowY;
  }

  /* ===== API: addTitle ===== */
  function addTitle(x, y, text, options = {}) {
    const el = document.createElement('div');
    el.className = 'canvas-title';
    el.id = uid('title');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.fontSize = (options.fontSize || 48) + 'px';
    if (options.fontWeight) el.style.fontWeight = options.fontWeight;
    if (options.color) el.style.color = options.color;
    if (options.maxWidth) el.style.maxWidth = options.maxWidth + 'px';
    el.textContent = text;
    world.appendChild(el);
    return el;
  }

  /* ===== API: addText ===== */
  function addText(x, y, text, options = {}) {
    const el = document.createElement('div');
    el.className = 'canvas-text canvas-el';
    el.id = uid('text');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.fontSize = (options.fontSize || 14) + 'px';
    if (options.color) el.style.color = options.color;
    if (options.maxWidth) el.style.maxWidth = options.maxWidth + 'px';
    el.textContent = text;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addTag ===== */
  function addTag(x, y, label, options = {}) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('tag');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    const dotColor = options.color || 'var(--accent)';
    el.innerHTML = `<div class="canvas-tag"><span class="tag-dot" style="background:${dotColor}"></span>${label}</div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addContextCard ===== */
  function addContextCard(x, y, w, h, title, content) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('ctx');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = w + 'px';
    if (h) el.style.height = h + 'px';
    el.innerHTML = `<div class="context-card" style="width:100%;${h ? 'height:100%' : ''}">
      <div class="card-head"><div class="head-indicator"></div><h3>${title}</h3></div>
      <div class="card-content">${content}</div>
    </div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addDesignSystemCard ===== */
  function addDesignSystemCard(x, y, w, h, type, data) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('ds');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = w + 'px';
    if (h) el.style.height = h + 'px';

    let body = '';
    if (type === 'color' && Array.isArray(data.colors)) {
      body = `<div class="color-grid">${data.colors.map(c =>
        `<div class="color-chip" style="background:${c.hex}"><span class="chip-label">${c.name || c.hex}</span></div>`
      ).join('')}</div>`;
    } else if (type === 'typography' && Array.isArray(data.samples)) {
      body = `<div class="type-stack">${data.samples.map(s =>
        `<div class="type-row"><span class="type-label">${s.label}</span><span class="type-sample" style="font-size:${s.size}px;font-weight:${s.weight || 400}">${s.text || 'Aa'}</span></div>`
      ).join('')}</div>`;
    } else if (typeof data.html === 'string') {
      body = data.html;
    }

    el.innerHTML = `<div class="ds-card" style="width:100%;${h ? 'height:100%' : ''}">
      <div class="ds-head">${data.title || type}</div>
      <div class="ds-body">${body}</div>
    </div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addColorSwatch ===== */
  function addColorSwatch(x, y, colors) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('swatch');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.innerHTML = `<div class="color-swatch-group">${colors.map(c =>
      `<div class="swatch-item">
        <div class="swatch-circle" style="background:${c.hex}"></div>
        <div class="swatch-name">${c.name || ''}</div>
        <div class="swatch-hex">${c.hex}</div>
      </div>`
    ).join('')}</div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addTypeSample ===== */
  function addTypeSample(x, y, samples) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('typesample');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.innerHTML = `<div class="type-sample-group">${samples.map(s =>
      `<div class="type-sample-row">
        <span class="type-sample-meta">${s.label}<br>${s.size}px</span>
        <span class="type-sample-text" style="font-size:${s.size}px;font-weight:${s.weight || 400};${s.font ? 'font-family:' + s.font : ''}">${s.text || 'The quick brown fox'}</span>
      </div>`
    ).join('')}</div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addPage ===== */
  let _pageNum = 0;
  function addPage(x, y, w, h, label, htmlContent) {
    _pageNum++;
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('page');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = w + 'px';
    el.style.height = (h + 40) + 'px';
    el.innerHTML = `<div class="design-page" style="width:${w}px;height:${h}px;">
      <div class="page-content">${htmlContent}</div>
    </div>
    <div class="page-label"><span class="label-num">${String(_pageNum).padStart(2,'0')}</span>${label}</div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addNote ===== */
  function addNote(x, y, tag, text) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('note');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.innerHTML = `<div class="canvas-note">
      <div class="note-tag">${tag}</div>
      <div class="note-body">${text}</div>
    </div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== API: addDiagram ===== */
  function addDiagram(x, y, w, h, htmlContent) {
    const el = document.createElement('div');
    el.className = 'canvas-el';
    el.id = uid('diagram');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.innerHTML = `<div class="canvas-diagram" style="width:100%;height:100%;">
      <div class="diagram-content">${htmlContent}</div>
    </div>`;
    world.appendChild(el);
    makeDraggable(el);
    return el;
  }

  /* ===== Layout helpers (overlap prevention) ===== */
  function below(el, gap) { if (gap === undefined) gap = 20; return parseFloat(el.style.top) + el.offsetHeight + gap; }
  function rightOf(el, gap) { if (gap === undefined) gap = 20; return parseFloat(el.style.left) + el.offsetWidth + gap; }
  function maxY(els, gap) { if (gap === undefined) gap = 20; return Math.max(...els.map(e => parseFloat(e.style.top) + e.offsetHeight)) + gap; }
  function maxX(els, gap) { if (gap === undefined) gap = 20; return Math.max(...els.map(e => parseFloat(e.style.left) + e.offsetWidth)) + gap; }

  /* ===== expose API ===== */
  window.canvas = { addSection, addTitle, addText, addTag, addContextCard, addDesignSystemCard, addColorSwatch, addTypeSample, addPage, addNote, addDiagram, below, rightOf, maxY, maxX };

  /* ===== scene ===== */
  function initScene() {
    addSection(40, UI_STRINGS.sections.context);

    const r1Title = addTitle(100, 84, '能力中枢', { fontSize: 62, fontWeight: 700 });
    const r1Sub = addTitle(100, below(r1Title, 6), 'GBT小土豆V8 · 五十八块面板 · 朋友圈关系场已可视化 · 品牌 Logo 已接入',
      { fontSize: 16, fontWeight: 500, color: 'var(--text-tertiary)' });
    const r1Desc = addText(100, below(r1Sub, 20),
      '留位的空壳全部清掉了：对话、能力广场、大脑执行层、领域分类、审计台账、系统体检、设置，\n' +
      '七块面板每一块都接真实读数。其中大脑执行层是重头戏 —— 五维链路不是示意图，\n' +
      '是把 brain_route / brain_execute / brain_verify / brain_health / brain_unify 真跑了一遍采下来的。',
      { fontSize: 15, maxWidth: 480 });

    const tagsY = below(r1Desc, 18);
    const t1 = addTag(100, tagsY, '四十一块面板');
    const t2 = addTag(rightOf(t1, 8), tagsY, '大脑执行层五维实测');
    const t3 = addTag(rightOf(t2, 8), tagsY, '零留位');
    addTag(rightOf(t3, 8), tagsY, '亮 / 暗双主题');

    const cardsY = below(t1, 26);
    const c1 = addContextCard(100, cardsY, 288, null, '是什么',
      '<ul><li>一个能力中枢 App：七块面板全部接真实读数</li><li>对话优先 —— 左导航、会话列、对话区、composer</li><li>大脑执行层单独做精细可视化，是这一版的重头戏</li></ul>');
    const c2 = addContextCard(408, cardsY, 288, null, '给谁用',
      '<ul><li>把 151 项能力当自己身体用的主人</li><li>九成时间在说话办事，偶尔要盘一次家账</li><li>想知道大脑到底怎么选、怎么跑、怎么验，而不是只看结果</li></ul>');
    const c3 = addContextCard(716, cardsY, 288, null, '解决什么问题',
      '<ul><li>上一版五个栏目是空壳留位，点进去什么都没有</li><li>清掉留位，换成七块能点、能看、有真数的面板</li><li>大脑执行层从「看不见」变成「五维可核」</li></ul>');

    const notesY = maxY([c1, c2, c3], 30);
    const n1 = addNote(100, notesY, '五维实测',
      '健康维 100 分 · 5/5；路由维两条意图分别命中 caps_called_audit（18 候选）与 mind（14 候选）；执行维真调 health 273ms；验证维真抓屏指纹 1111…1070ms；合一 24.2s。');
    const n2 = addNote(rightOf(n1, 20), notesY, '降级如实',

/* V21 · 影视氛围层的运动编排（只做两件事：面板入场错的节奏、画布开场的镜头落位）*/
(function () {
  'use strict';
  var reduce = false;
  try {
    reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { /* 老浏览器当作不降级 */ }

  /* ① 给容器直接子元素编号，供 CSS 的 animation-delay: calc(min(var(--ci),11) * 42ms) 使用
        注意：第 13 个之后必须显式写 11。若留空，var(--ci,0) 会回落到 0，
        后面的元素反而比前面的先出现 —— 级联顺序就反了。 */
  function cineStagger(root) {
    if (!root) return;
    var kids = root.children;
    for (var i = 0; i < kids.length; i++) {
      var v = String(i < 11 ? i : 11);
      if (kids[i].style.getPropertyValue('--ci') !== v) kids[i].style.setProperty('--ci', v);
    }
  }
  function cineStaggerAll() {
    cineStagger(document.getElementById('chatBody'));
    cineStagger(document.getElementById('godBody'));
  }
  cineStaggerAll();

  /* 面板内容是整体替换 innerHTML 的，用 MutationObserver 兜住所有渲染路径
     （比包 renderPanel 更稳：panelChat 之类的直接被调也照样生效）
     只监听 childList —— 我们改的是 style 自定义属性，不会自触发。 */
  try {
    var mo = new MutationObserver(function () { cineStaggerAll(); });
    ['chatBody', 'godBody'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) mo.observe(el, { childList: true });
    });
  } catch (e) { /* 无 MutationObserver 就退化成只在初始化编排一次 */ }

  /* ② 画布开场：镜头从略远处落位。只用一次性 transform 过渡，落位后立刻摘掉过渡，

  if (!reduce && typeof zoom === 'number' && document.getElementById('world')) {

        zoom = z0; panX = px; panY = py;
        updateTransform();
        window.setTimeout(function () { w.style.transition = ''; }, 1250);
      });
    } catch (e) { /* 没有画布环境就跳过 */ }
  }
})();
